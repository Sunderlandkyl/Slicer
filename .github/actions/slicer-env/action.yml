name: "Slicer build environment"
description: >-
  Prepare a GitHub-hosted runner to build Slicer (or a Slicer extension): fixed
  build root, system packages, CMake, Qt, optional sccache, and optionally
  restore a Slicer build tree published by the Slicer build workflow (from a
  GitHub release or from workflow artifacts).

inputs:
  qt-version:
    description: "Qt version to install (ignored when a restored manifest specifies one)"
    default: "5.15.2"
  qt-modules:
    description: "Extra Qt modules to install (defaults to the set required by Slicer for the Qt major version)"
    default: ""
  cmake-version:
    description: "CMake version to install (jwlawson/actions-setup-cmake syntax)"
    default: "3.31.x"
  sccache:
    description: "Enable sccache (GitHub Actions cache backend) on Linux/macOS"
    default: "true"
  sccache-size:
    description: "Maximum size of the sccache cache"
    default: "4G"
  free-disk-space:
    description: >-
      Remove unneeded pre-installed tooling on Linux runners. Off by default:
      a GitHub-hosted runner has around 85 GB free, which is enough for a
      Slicer build tree.
    default: "false"
  install-qt:
    description: "Install Qt"
    default: "true"
  # ---- Restore options -------------------------------------------------------
  repository:
    description: "Repository hosting the Slicer releases (owner/name)"
    default: ${{ github.repository }}
  token:
    description: "Token used to download releases/artifacts"
    default: ${{ github.token }}
  build-source:
    description: "Where to restore the Slicer build tree from: '', 'release' or 'artifact'"
    default: ""
  build-release-tag:
    description: "Release tag holding the Slicer build tree (build-source=release)"
    default: "nightly"
  build-artifact-name:
    description: "Workflow artifact holding the Slicer build tree (build-source=artifact)"
    default: ""

outputs:
  platform:
    description: "linux, macos or windows"
    value: ${{ steps.env.outputs.platform }}
  root:
    description: "Fixed root directory"
    value: ${{ steps.env.outputs.root }}
  source-dir:
    description: "Slicer source directory"
    value: ${{ steps.env.outputs.source-dir }}
  superbuild-dir:
    description: "Slicer superbuild directory"
    value: ${{ steps.env.outputs.superbuild-dir }}
  slicer-dir:
    description: "Slicer inner build directory (Slicer_DIR)"
    value: ${{ steps.env.outputs.slicer-dir }}
  output-dir:
    description: "Directory for archives, logs and packages"
    value: ${{ steps.env.outputs.output-dir }}
  qt-dir:
    description: "Qt prefix directory"
    value: ${{ steps.qt-dir.outputs.qt-dir }}
  qt-version:
    description: "Installed Qt version"
    value: ${{ steps.versions.outputs.qt-version }}
  manifest:
    description: "Path of the restored manifest (empty when nothing was restored)"
    value: ${{ steps.versions.outputs.manifest }}

runs:
  using: composite
  steps:
    - name: Initialize environment
      id: env
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/../../scripts/slicer-ci.sh" || true
        echo "SLICER_CI=${{ github.action_path }}/../../scripts/slicer-ci.sh" >> "$GITHUB_ENV"
        "${{ github.action_path }}/../../scripts/slicer-ci.sh" env

    - name: Free disk space
      if: inputs.free-disk-space == 'true'
      shell: bash
      run: '"$SLICER_CI" free-disk-space'

    - name: Install system packages
      shell: bash
      run: '"$SLICER_CI" install-system-packages'

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@802fa1a2c4e212495c05bf94dba2704a92a472be # v2.0.2
      with:
        cmake-version: ${{ inputs.cmake-version }}

    # ---- Restore: download manifests/archives -------------------------------

    - name: Download the build tree (release)
      if: inputs.build-source == 'release'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        "$SLICER_CI" restore-release "${{ inputs.repository }}" "${{ inputs.build-release-tag }}" all

    - name: Download the build tree (artifact)
      if: inputs.build-source == 'artifact'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.build-artifact-name }}
        path: ${{ steps.env.outputs.output-dir }}/restore

    - name: Read manifest
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        manifest="$SLICER_OUTPUT_DIR/restore/manifest-${SLICER_PLATFORM}.json"
        qt="${{ inputs.qt-version }}"
        if [ -f "$manifest" ]; then
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          cat "$manifest"
          mqt="$("$SLICER_CI" manifest-get "$manifest" qt_version)"
          if [ -n "$mqt" ]; then
            qt="$mqt"
          fi
          root="$("$SLICER_CI" manifest-get "$manifest" root)"
          if [ -n "$root" ] && [ "$root" != "$SLICER_ROOT" ]; then
            echo "::error::The restored build tree was built at '$root' but this runner uses '$SLICER_ROOT'."
            exit 1
          fi
        else
          echo "manifest=" >> "$GITHUB_OUTPUT"
        fi
        echo "qt-version=$qt" >> "$GITHUB_OUTPUT"
        echo "SLICER_QT_VERSION=$qt" >> "$GITHUB_ENV"

    # ---- Toolchain -------------------------------------------------------------

    - name: Resolve Qt install options
      id: qt-options
      shell: bash
      run: |
        set -euo pipefail
        version="${{ steps.versions.outputs.qt-version }}"
        major="${version%%.*}"
        modules="${{ inputs.qt-modules }}"
        if [ -z "$modules" ]; then
          if [ "$major" = "6" ]; then
            # Qt 6: Core5Compat, StateMachine, WebEngine and Multimedia are add-ons.
            modules="qtwebengine qtwebchannel qtpositioning qt5compat qtmultimedia qtscxml qtshadertools qtimageformats"
          else
            # Qt 5: WebEngine is the only add-on Slicer needs; the other
            # required modules are part of the base installation.
            modules="qtwebengine"
          fi
        fi
        case "$RUNNER_OS" in
          Windows) arch="win64_msvc2019_64" ;;
          macOS)   arch="clang_64" ;;
          *)       arch="gcc_64" ;;
        esac
        if [ "$major" = "6" ]; then
          case "$RUNNER_OS" in
            Windows) arch="win64_msvc2022_64" ;;
            macOS)   arch="clang_64" ;;
            *)       arch="linux_gcc_64" ;;
          esac
        fi
        echo "modules=$modules" >> "$GITHUB_OUTPUT"
        echo "arch=$arch" >> "$GITHUB_OUTPUT"
        echo "major=$major" >> "$GITHUB_OUTPUT"
        echo "Qt $version ($arch): $modules"

    - name: Install Qt
      if: inputs.install-qt == 'true'
      uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
      with:
        version: ${{ steps.versions.outputs.qt-version }}
        dir: ${{ steps.env.outputs.root }}/Qt
        target: desktop
        arch: ${{ steps.qt-options.outputs.arch }}
        modules: ${{ steps.qt-options.outputs.modules }}
        cache: false
        setup-python: false

    - name: Locate Qt
      id: qt-dir
      shell: bash
      run: |
        set -euo pipefail
        qt_dir="${QT_ROOT_DIR:-}"
        if [ -z "$qt_dir" ]; then
          qt_dir="$(ls -d "$SLICER_ROOT/Qt/${SLICER_QT_VERSION}"/*/ 2>/dev/null | head -n1 | sed 's:/*$::' || true)"
        fi
        major="${{ steps.qt-options.outputs.major }}"
        if [ "${{ inputs.install-qt }}" = "true" ] && [ ! -d "$qt_dir/lib/cmake/Qt${major}" ]; then
          echo "::error::Qt not found under $SLICER_ROOT/Qt (QT_ROOT_DIR='$QT_ROOT_DIR')"; exit 1
        fi
        # Normalize to forward slashes for CMake
        qt_dir="${qt_dir//\\//}"
        echo "qt-dir=$qt_dir" >> "$GITHUB_OUTPUT"
        echo "SLICER_QT_DIR=$qt_dir" >> "$GITHUB_ENV"
        echo "Qt: $qt_dir"

    - name: Set up sccache
      if: inputs.sccache == 'true' && runner.os != 'Windows'
      uses: Mozilla-Actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

    - name: Enable sccache
      if: inputs.sccache == 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "SLICER_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
        # Stay well inside the 10 GB the GitHub Actions cache allows per
        # repository, which is also used for the test data.
        echo "SCCACHE_CACHE_SIZE=${{ inputs.sccache-size }}" >> "$GITHUB_ENV"

    - name: Configure MSVC parallel compilation
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # /MP: compile multiple sources in parallel within each project.
        echo "CL=/MP" >> "$GITHUB_ENV"
        echo "CMAKE_BUILD_PARALLEL_LEVEL=${NUMBER_OF_PROCESSORS:-4}" >> "$GITHUB_ENV"

    # ---- Restore: extract -------------------------------------------------------

    - name: Unpack the downloaded artifact
      if: inputs.build-source == 'artifact'
      shell: bash
      run: |
        set -euo pipefail
        dest="$SLICER_OUTPUT_DIR/restore"
        # The external projects first: the inner build tree refers to them.
        for a in "deps-${SLICER_PLATFORM}" "slicer-source-${SLICER_PLATFORM}" "slicer-build-${SLICER_PLATFORM}"; do
          if [ -f "$dest/$a.tar.zst" ] || ls "$dest/$a.tar.zst".part-* >/dev/null 2>&1; then
            "$SLICER_CI" unpack "$dest/$a.tar.zst"
            rm -f "$dest/$a.tar.zst" "$dest/$a.tar.zst".part-* 2>/dev/null || true
          fi
        done
        "$SLICER_CI" report
