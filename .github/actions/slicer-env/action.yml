name: "Slicer build environment"
description: >-
  Prepare a GitHub-hosted runner to build Slicer: fixed build root, system
  packages, CMake, Qt and a compiler cache.

inputs:
  qt-version:
    description: "Qt version to install"
    default: "5.15.2"
  cmake-version:
    description: "CMake version to install (jwlawson/actions-setup-cmake syntax)"
    default: "3.31.x"
  compiler-cache:
    description: "Enable the ccache compiler cache on Linux and macOS"
    default: "true"

runs:
  using: composite
  steps:
    - name: Initialize the environment
      id: env
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/../../scripts/slicer-ci.sh" || true
        echo "SLICER_CI=${{ github.action_path }}/../../scripts/slicer-ci.sh" >> "$GITHUB_ENV"
        echo "SLICER_QT_VERSION=${{ inputs.qt-version }}" >> "$GITHUB_ENV"
        "${{ github.action_path }}/../../scripts/slicer-ci.sh" env

    - name: Install the system packages
      shell: bash
      run: '"$SLICER_CI" install-system-packages'

    # The action looks the version up through the GitHub API, which now and
    # then answers "Server Error": try a second time before failing the job.
    - name: Install CMake
      id: cmake
      continue-on-error: true
      uses: jwlawson/actions-setup-cmake@802fa1a2c4e212495c05bf94dba2704a92a472be # v2.0.2
      with:
        cmake-version: ${{ inputs.cmake-version }}

    - name: Wait before installing CMake again
      if: steps.cmake.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Install CMake (second attempt)
      if: steps.cmake.outcome == 'failure'
      uses: jwlawson/actions-setup-cmake@802fa1a2c4e212495c05bf94dba2704a92a472be # v2.0.2
      with:
        cmake-version: ${{ inputs.cmake-version }}

    - name: Resolve the Qt installation options
      id: qt-options
      shell: bash
      run: |
        set -euo pipefail
        version="${{ inputs.qt-version }}"
        major="${version%%.*}"
        if [ "$major" = "6" ]; then
          # Qt 6: Core5Compat, StateMachine, WebEngine and Multimedia are add-ons.
          modules="qtwebengine qtwebchannel qtpositioning qt5compat qtmultimedia qtscxml qtshadertools qtimageformats"
          case "$RUNNER_OS" in
            Windows) arch="win64_msvc2022_64" ;;
            macOS)   arch="clang_64" ;;
            *)       arch="linux_gcc_64" ;;
          esac
        else
          # Qt 5: WebEngine is the only add-on Slicer needs.
          modules="qtwebengine"
          case "$RUNNER_OS" in
            Windows) arch="win64_msvc2019_64" ;;
            macOS)   arch="clang_64" ;;
            *)       arch="gcc_64" ;;
          esac
        fi
        echo "modules=$modules" >> "$GITHUB_OUTPUT"
        echo "arch=$arch" >> "$GITHUB_OUTPUT"
        echo "major=$major" >> "$GITHUB_OUTPUT"
        echo "Qt $version ($arch): $modules"

    # aqtinstall downloads each archive from a mirror picked by download.qt.io
    # and, on a timeout, tries one random fallback before giving up. Give slow
    # mirrors more time, retry connection errors, skip a mirror known to fail,
    # and fall back to a fixed list of reliable ones.
    - name: Configure aqtinstall
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/aqt.ini" <<'EOF'
        [requests]
        connection_timeout : 10
        response_timeout : 120
        max_retries_on_connection_error : 10
        [mirrors]
        blacklist :
            https://mirror.ossplanet.net
        fallbacks :
            https://ftp.fau.de/qtproject/
            https://mirror.netcologne.de/qtproject/
            https://mirrors.dotsrc.org/qtproject/
            https://master.qt.io/
            https://qt.mirror.constant.com/
            https://mirrors.ukfast.co.uk/sites/qt.io/
        EOF
        echo "AQT_CONFIG=$RUNNER_TEMP/aqt.ini" >> "$GITHUB_ENV"

    # The Qt mirrors occasionally refuse connections, so Qt is kept in the
    # GitHub Actions cache; the action saves it as soon as Qt is installed, so
    # a job that fails later still saves it. When a download is needed and
    # fails, a second attempt lets aqtinstall pick a mirror again.
    - name: Install Qt
      id: install-qt
      continue-on-error: true
      uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
      with:
        version: ${{ inputs.qt-version }}
        dir: ${{ steps.env.outputs.root }}/Qt
        target: desktop
        arch: ${{ steps.qt-options.outputs.arch }}
        modules: ${{ steps.qt-options.outputs.modules }}
        cache: true
        cache-key-prefix: slicer-qt
        # The action needs a Python to run aqtinstall. Letting it provision one
        # is required on macOS, whose system Python refuses to install into an
        # externally managed environment.
        setup-python: true

    - name: Install Qt (second attempt)
      if: steps.install-qt.outcome == 'failure'
      uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
      with:
        version: ${{ inputs.qt-version }}
        dir: ${{ steps.env.outputs.root }}/Qt
        target: desktop
        arch: ${{ steps.qt-options.outputs.arch }}
        modules: ${{ steps.qt-options.outputs.modules }}
        cache: true
        cache-key-prefix: slicer-qt
        setup-python: true

    - name: Locate Qt
      shell: bash
      run: |
        set -euo pipefail
        qt_dir="${QT_ROOT_DIR:-}"
        if [ -z "$qt_dir" ]; then
          qt_dir="$(ls -d "$SLICER_ROOT/Qt/${SLICER_QT_VERSION}"/*/ 2>/dev/null | head -n1 | sed 's:/*$::' || true)"
        fi
        major="${{ steps.qt-options.outputs.major }}"
        if [ ! -d "$qt_dir/lib/cmake/Qt${major}" ]; then
          echo "::error::Qt not found under $SLICER_ROOT/Qt (QT_ROOT_DIR='$QT_ROOT_DIR')"; exit 1
        fi
        qt_dir="${qt_dir//\\//}"
        echo "SLICER_QT_DIR=$qt_dir" >> "$GITHUB_ENV"
        echo "Qt: $qt_dir"

    # ccache rather than sccache, whose GitHub Actions backend leaves one cache
    # entry per compiled object in the repository.
    - name: Set up the compiler cache
      if: inputs.compiler-cache == 'true' && runner.os != 'Windows'
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: slicer-${{ steps.env.outputs.platform }}
        max-size: 2G

    - name: Enable the compiler cache
      if: inputs.compiler-cache == 'true' && runner.os != 'Windows'
      shell: bash
      run: echo "SLICER_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
