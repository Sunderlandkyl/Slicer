name: "Slicer build stage"
description: >-
  Build one target of the Slicer superbuild tree in the fixed build root,
  optionally restoring the tree produced by a previous stage first, then
  archive the result. Requires the 'slicer-env' action to have been run.

inputs:
  target:
    description: "Space separated superbuild targets to build (VTK, ITK, Slicer-dependencies, Slicer, ...); those not in the current configuration are skipped"
    required: true
  restore-artifact:
    description: "Workflow artifact (containing <archive-name>.tar.zst) to restore before building"
    default: ""
  restore-archive:
    description: "Name of the archive inside the restored artifact (without extension)"
    default: "deps-stage"
  archive-name:
    description: "Name of the archive to create (without extension); empty to skip"
    default: "deps-stage"
  archive-paths:
    description: >-
      Space separated paths (relative to the root) to archive. Include "Slicer"
      to carry the source tree over to the next stage: a new checkout would
      make CMake re-run the steps of every external project.
    default: "SR Slicer"
  upload-artifact:
    description: "Name of the workflow artifact to upload the archive to; empty to skip"
    default: ""

runs:
  using: composite
  steps:
    - name: Copy source tree to the build root
      shell: bash
      run: |
        set -euo pipefail
        src="$SLICER_SOURCE_DIR"
        if [ -d "$src/.git" ]; then
          echo "Source tree already present at $src"
        else
          rm -rf "$src"
          mkdir -p "$src"
          # Copy rather than clone: the working tree, the checked out commit and
          # the full history (needed to compute Slicer_REVISION) are preserved
          # regardless of whether HEAD is detached.
          echo "Copying $GITHUB_WORKSPACE -> $src"
          cp -a "$GITHUB_WORKSPACE/." "$src/"

          # The compiler cache action keeps its cache in the workspace: it
          # must not be archived and published with the source tree.
          rm -rf "$src/.ccache" "$src/.cache"
          rm -f "$src"/*.log
          # The checkout of the CI scripts used by build-application.yml is
          # not part of the sources.
          rm -rf "$src/.slicer-ci"

          # Give every source file a timestamp older than any stamp in a
          # restored superbuild tree: the time of the checkout would make CMake
          # re-run the configure and build steps of every external project.
          # Nothing is missed: whatever changes an external project changes
          # the prerequisites key, and rebuilds them from scratch.
          echo "Normalizing the timestamps of the source tree"
          find "$src" -path "$src/.git" -prune -o -print0 \
            | xargs -0 touch -h -t 200001010000 2>/dev/null \
            || find "$src" -path "$src/.git" -prune -o -print0 \
            | xargs -0 touch -t 200001010000 2>/dev/null || true
        fi
        git -C "$src" log -1 --oneline || true
        git -C "$src" status --short | head -n 5 || true

    - name: Download previous stage
      if: inputs.restore-artifact != ''
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.restore-artifact }}
        path: ${{ env.SLICER_OUTPUT_DIR }}/restore

    - name: Restore previous stage
      if: inputs.restore-artifact != ''
      shell: bash
      run: |
        set -euo pipefail
        "$SLICER_CI" unpack "$SLICER_OUTPUT_DIR/restore/${{ inputs.restore-archive }}.tar.zst"
        rm -rf "$SLICER_OUTPUT_DIR/restore"

    - name: Configure
      shell: bash
      run: '"$SLICER_CI" configure'

    - name: Build ${{ inputs.target }}
      shell: bash
      env:
        TARGETS: ${{ inputs.target }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086 - the targets are deliberately word split
        "$SLICER_CI" build $TARGETS

    - name: Report
      if: always()
      shell: bash
      run: '"$SLICER_CI" report'

    - name: Archive
      if: inputs.archive-name != ''
      shell: bash
      env:
        PATHS: ${{ inputs.archive-paths }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086 - the paths are deliberately word split
        "$SLICER_CI" pack "$SLICER_OUTPUT_DIR/${{ inputs.archive-name }}.tar.zst" $PATHS

    - name: Upload ${{ inputs.upload-artifact }}
      if: inputs.upload-artifact != '' && inputs.archive-name != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.upload-artifact }}
        path: ${{ env.SLICER_OUTPUT_DIR }}/${{ inputs.archive-name }}.tar.zst
        retention-days: 2
        compression-level: 0
        if-no-files-found: error
