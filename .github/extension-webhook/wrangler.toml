# The relay of the webhook of the Slicer nightly GitHub App: see worker.js.
#   npx wrangler deploy
#   npx wrangler secret put WEBHOOK_SECRET          # of the Slicer nightly app
#   npx wrangler secret put RELAY_APP_PRIVATE_KEY   # of the relay app, PKCS#8
name = "slicer-extension-webhook"
main = "worker.js"
compatibility_date = "2026-11-01"

# When the nightly build of Slicer (NIGHTLY_WORKFLOW) is started, in UTC.
[triggers]
crons = ["30 5 * * *"]

[vars]
# The relay app: installed in SLICER_REPOSITORY alone, Actions read and write.
RELAY_APP_ID = ""
SLICER_REPOSITORY = "Slicer/Slicer"
SLICER_REF = "main"
REFS = ""
# The workflow the cron trigger starts, with its nightly input; none when empty.
NIGHTLY_WORKFLOW = "build.yml"
# The release whose wheels are handed to the pages that install extensions
# (GET /gh/...); nightly when empty.
RELEASE_TAG = ""
