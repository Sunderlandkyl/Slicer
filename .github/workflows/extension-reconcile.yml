# Brings the extensions up to date with the Slicer nightly, in dependency
# order, and publishes the catalog of the ones that are consistent with each
# other (extensions-catalog.json of the nightly release).
#
# Extensions are built by their own repositories (extension-build.yml), and
# some depend on others: SlicerIGT is linked against SlicerIGSIO, SlicerHeart
# uses SlicerIGT. An extension is not built again by the ones that depend on
# it: they restore the build tree it published. So they have to be built in
# order, and built again when what they depend on changes, which no extension
# repository can do for another. This workflow does, through the Slicer
# nightly GitHub App installed in them (SLICER_NIGHTLY_APP_ID,
# SLICER_NIGHTLY_APP_PRIVATE_KEY).
#
# It works out what to do from what is published, each time, and remembers
# nothing: it starts the builds of the extensions that are not built against
# the Slicer of the nightly, the head of their branch and the packages their
# dependencies publish, waits for them, and starts the ones that depended on
# them. Starting it is therefore always safe, and what starts it is only a
# matter of how soon a change is seen:
#   - the Build workflow, each time one of its platforms has published;
#   - the relay of the webhook of the Slicer nightly GitHub App
#     (.github/extension-webhook), when a platform of an extension has been
#     built on the branch it is built from (a commit there, which the
#     extension builds and publishes itself, or a build this workflow
#     started), or when the app is installed in more repositories: no extension
#     repository can start this workflow, the relay can. It does when no run
#     is waiting already: many events are one reason to look;
#   - a schedule, as a backstop only, for an event that was missed: GitHub
#     starts scheduled runs late or not at all under load, and stops them in
#     a repository without activity. A pass with nothing to build stops
#     within a minute or two;
#   - by hand, to get a commit of an extension out now;
#   - a repository_dispatch event (reconcile-extensions), for whatever can
#     report a commit to an extension.
#
# See .github/scripts/extension-reconcile.py and
# Docs/developer_guide/build_instructions/github_actions.md
name: Reconcile extensions

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "What started it (the relay says which build); shown in the summary of the run"
        type: string
        default: ""
      step:
        description: "A single look: start what can be started and stop, without waiting for the builds"
        type: boolean
        default: false
      retry:
        description: "Start again the builds that failed for the same Slicer, commit and dependencies"
        type: boolean
        default: false
      refs:
        description: 'Branches to build instead of the default ones, as JSON: {"owner/repository": "branch"}'
        type: string
        default: ""
      start-sites:
        description: "Start the sites that carry the web packages, when the catalog changed"
        type: boolean
        default: true
  repository_dispatch:
    types: [reconcile-extensions]
  schedule:
    - cron: "40 */6 * * *"

permissions:
  contents: read

# One at a time. A run started while one is going waits for it, and looks at
# what that one left; of several waiting, GitHub keeps the last.
concurrency:
  group: extension-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile
    if: vars.SLICER_NIGHTLY_APP_ID != ''
    runs-on: ubuntu-latest
    # The script stops before this, and starts another run to carry on.
    timeout-minutes: 350
    permissions:
      # The registry and the catalog go to the nightly release.
      contents: write
      # To start another run of this workflow.
      actions: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          sparse-checkout: .github/scripts

      - name: Reconcile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_ID: ${{ vars.SLICER_NIGHTLY_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SLICER_NIGHTLY_APP_PRIVATE_KEY }}
          RELEASE_TAG: nightly
          NIGHTLY_WORKFLOW: slicer-nightly-build.yml
          NIGHTLY_WEB_WORKFLOW: slicer-nightly-web.yml
          RETRY: ${{ inputs.retry || false }}
          # What started the run, for its summary.
          REASON: ${{ inputs.reason || (github.event_name == 'repository_dispatch' && 'a platform of Slicer was published') || github.event_name }}
          # A run stays for as long as builds are going, and goes down the
          # chains itself: one run for a whole burst of builds, not one per
          # build that ends.
          WAIT: ${{ !inputs.step }}
          REFS: ${{ inputs.refs || vars.SLICER_EXTENSION_REFS || '' }}
          # The tier of an extension is that of the Slicer ExtensionsIndex,
          # when the repository is the one it names. A fork listed here
          # ({"fork": "repository"}) stands for the repository it is a fork of.
          TRUSTED_FORKS: ${{ vars.SLICER_EXTENSION_TRUSTED_FORKS || '' }}
          EXTENSIONS_INDEX: ${{ vars.SLICER_EXTENSIONS_INDEX || '' }}
          START_SITES: ${{ github.event_name != 'workflow_dispatch' || inputs.start-sites }}
          # Well before the six hours a job may last: the run then starts its
          # successor, which takes up the builds that are still going.
          DEADLINE_MINUTES: "240"
          SELF_WORKFLOW: extension-reconcile.yml
          SELF_REF: ${{ github.ref_name }}
        run: python3 .github/scripts/extension-reconcile.py
