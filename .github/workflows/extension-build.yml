# Builds, tests, packages and loads a Slicer extension against a Slicer build
# published by the "Build" workflow.
#
# An extension repository calls this workflow instead of carrying the steps
# itself; it needs no checkout of Slicer and no Slicer build of its own:
#
#   jobs:
#     build:
#       uses: Slicer/Slicer/.github/workflows/extension-build.yml@main
#       with:
#         platforms: linux,macos,windows,web
#
# The web platform builds the extension for SlicerWeb (Slicer compiled to
# WebAssembly, https://github.com/lassoan/SlicerWeb) against the web build tree
# published with the nightly, and packages it as a Pyodide wheel.
#
# The packages are published to the nightly release of the calling repository,
# with one description per platform, extension-<platform>.json, which says what
# the package was built from and against:
#
#   {"name": ..., "repository": ..., "platform": "linux",
#    "package": {"file": <asset>, "sha256": ...,
#                "revision": <commit of the extension>,
#                "slicer_commit": ..., "slicer_revision": ...,
#                "tests": "passed" | "failed" | "not run",
#                "depends": [<Name>, ...],
#                "built_with": {<Name>: {"repository", "revision",
#                                        "package", "sha256"}},
#                "build_tree": {"files": [...], "sha256": {...},
#                               "config_dir": ..., "subdirectory": ...}},
#    "previous": <the package built against the Slicer before>,
#    "web": <for web: its entry of SlicerWeb's extension index>}
#
# One per platform, so that a platform is published as soon as it is built,
# by a run of its own, without waiting for, or overwriting, the others.
#
# built_with names the very packages of the extensions it depends on that it
# was built against: an extension is not built again by the ones that depend on
# it, they restore the build tree it published (publish-build-tree), as they do
# Slicer's. So a set of packages is consistent when every built_with matches
# what the named repository publishes, which is what the extensions catalog of
# the Slicer release (extension-reconcile.yml) is made of.
#
# See Docs/developer_guide/build_instructions/github_actions.md
name: Extension build

on:
  workflow_call:
    inputs:
      platforms:
        description: "Platforms to build on (comma separated: linux,macos,windows,web)"
        type: string
        default: "linux"
      source-directory:
        description: "Directory of the extension within the repository"
        type: string
        default: "."
      extension-name:
        description: "CMake project name of the extension (default: the repository name)"
        type: string
        default: ""
      cmake-options:
        description: "Additional options for the extension's configure step"
        type: string
        default: ""
      build-dependencies:
        description: >-
          Provide the extensions it depends on (EXTENSION_DEPENDS): the build
          tree published by the repository of the registry of the Slicer
          release that builds each, for the same Slicer commit; one that no
          repository of the registry builds is built from the Slicer
          ExtensionsIndex
        type: boolean
        default: true
      publish-build-tree:
        description: >-
          Publish the build tree of each platform with its package, for the
          extensions that depend on this one to build against; needs publish
        type: boolean
        default: false
      run-tests:
        description: "Run the extension's tests"
        type: boolean
        default: true
      package:
        description: "Build the extension's package"
        type: boolean
        default: true
      load-in-slicer:
        description: "Load the built extension into Slicer"
        type: boolean
        default: true
      upload-package:
        description: "Upload the package as a workflow artifact"
        type: boolean
        default: true
      artifact-prefix:
        description: "Name of the package artifact, without the platform (default: the repository name)"
        type: string
        default: ""
      submodules:
        description: "Value for the checkout action's submodules option"
        type: string
        default: "false"
      slicer-repository:
        description: "Repository publishing the Slicer build"
        type: string
        default: "Slicer/Slicer"
      slicer-ref:
        description: >-
          Ref of the Slicer repository providing the actions and the helper
          script; pin it to whatever this workflow is pinned to
        type: string
        default: "main"
      release-tag:
        description: "Release holding the Slicer build to build against"
        type: string
        default: "nightly"
      qt-version:
        description: "Qt version to install (default: the one the build was made with)"
        type: string
        default: ""
      web-build-subdirectory:
        description: >-
          For the web platform, of an extension SlicerWeb's catalog does not
          describe: where its superbuild builds the extension itself
          ("inner-build"), or "." for an extension without a superbuild. The
          description of the catalog says it for the others.
        type: string
        default: ""
      publish:
        description: >-
          Publish the packages to the release publish-tag of the calling
          repository; the calling job must grant `contents: write`
        type: boolean
        default: false
      publish-tag:
        description: "Tag of the release the packages are published to"
        type: string
        default: "nightly"
      timeout-minutes:
        description: "Timeout of each desktop platform's job"
        type: number
        default: 120
      web-timeout-minutes:
        description: "Timeout of the web platform's job"
        type: number
        default: 240

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      found: ${{ steps.matrix.outputs.found }}
      web: ${{ steps.matrix.outputs.web }}
      artifact-prefix: ${{ steps.matrix.outputs.artifact-prefix }}
      extension-name: ${{ steps.matrix.outputs.extension-name }}
    steps:
      - name: Choose the platforms
        id: matrix
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
          SLICER_REPOSITORY: ${{ inputs.slicer-repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
          EXTENSION_NAME: ${{ inputs.extension-name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix="$ARTIFACT_PREFIX"
          [ -n "$prefix" ] || prefix="${GITHUB_REPOSITORY##*/}"
          echo "artifact-prefix=$prefix" >> "$GITHUB_OUTPUT"
          name="$EXTENSION_NAME"
          [ -n "$name" ] || name="${GITHUB_REPOSITORY##*/}"
          echo "extension-name=$name" >> "$GITHUB_OUTPUT"
          # There is nothing to build against until a Slicer build has been
          # published, which is not a failure: an extension repository enabling
          # this before the first nightly exists should not go red.
          if ! assets="$(gh release view "$RELEASE_TAG" -R "$SLICER_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            echo "::notice::No '$RELEASE_TAG' release in $SLICER_REPOSITORY; nothing to build against."
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          entries="" web=false
          for p in ${PLATFORMS//,/ }; do
            case "$p" in
              linux)   entries="$entries {\"platform\":\"linux\",\"runner\":\"ubuntu-22.04\"}," ;;
              macos)   entries="$entries {\"platform\":\"macos\",\"runner\":\"macos-15-intel\"}," ;;
              windows) entries="$entries {\"platform\":\"windows\",\"runner\":\"windows-2022\"}," ;;
              web)
                # Built against the web build tree, which a Slicer build
                # publishes when web is among its platforms.
                if grep -qx slicerweb-manifest.json <<< "$assets"; then
                  web=true
                else
                  echo "::notice::The '$RELEASE_TAG' release of $SLICER_REPOSITORY has no web build tree; web skipped."
                fi ;;
              *) echo "::warning::unknown platform '$p'" ;;
            esac
          done
          [ -n "$entries" ] || [ "$web" = "true" ] || { echo "::error::no platform to build in '$PLATFORMS'"; exit 1; }
          # The desktop job is skipped when there is no desktop platform;
          # GitHub rejects a matrix whose include is empty, so it is given a
          # placeholder it never expands.
          found=false
          if [ -n "$entries" ]; then found=true; fi
          matrix="{\"include\":[${entries%,}]}"
          [ "$found" = "true" ] || matrix='{"include":[{"platform":"none","runner":"ubuntu-latest"}]}'
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix; web: $web"

  build:
    name: ${{ matrix.platform }}
    needs: setup
    if: needs.setup.outputs.found == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      # Built at fixed paths (<root>/E/<Name>, from <root>/ES/<Name>), so that
      # its build tree can be restored by the extensions that depend on it.
      SLICER_EXT_NAME: ${{ needs.setup.outputs.extension-name }}
      SLICER_EXT_SOURCE_DIR: ${{ github.workspace }}/${{ inputs.source-directory }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: ${{ inputs.submodules }}

      # A reusable workflow resolves a local action path against the repository
      # that called it, not the one it lives in, so the action it needs is
      # checked out here. Which commit of Slicer that is cannot be read from
      # the run: github.job_workflow_ref and github.job_workflow_sha, which
      # state it, are empty in a called workflow. It is `slicer-ref`, so a
      # caller pinning this workflow to a tag should pin that to the same tag.
      - name: Check out the Slicer actions
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ inputs.slicer-repository }}
          ref: ${{ inputs.slicer-ref }}
          path: .slicer-actions
          sparse-checkout: .github

      - name: Set up the Slicer build
        id: slicer
        uses: ./.slicer-actions/.github/actions/setup-slicer-build
        with:
          repository: ${{ inputs.slicer-repository }}
          ref: ${{ inputs.slicer-ref }}
          release-tag: ${{ inputs.release-tag }}
          qt-version: ${{ inputs.qt-version }}

      # The runners have no GPU, and the OpenGL that Windows provides without
      # one is too old for VTK to create a render window.
      - name: Install software OpenGL
        if: matrix.platform == 'windows' && (inputs.run-tests || inputs.load-in-slicer)
        shell: bash
        run: '"$SLICER_CI" install-software-opengl'

      # The extensions it depends on (EXTENSION_DEPENDS): the build tree each
      # published for this platform and this Slicer commit, restored. One that
      # no repository of the registry builds is built from the ExtensionsIndex.
      - name: Restore the dependencies
        if: inputs.build-dependencies
        shell: bash
        env:
          SLICER_EXT_SOURCE_DIR: ${{ github.workspace }}/${{ inputs.source-directory }}
          SLICER_EXT_CMAKE_OPTIONS: ${{ inputs.cmake-options }}
          SLICER_COMMIT: ${{ steps.slicer.outputs.slicer-commit }}
          SLICER_EXT_REGISTRY: https://github.com/${{ inputs.slicer-repository }}/releases/download/${{ inputs.release-tag }}/extension-repositories.json
        run: '"$SLICER_CI" extension-dependencies'

      - name: Configure
        shell: bash
        env:
          SLICER_EXT_SOURCE_DIR: ${{ github.workspace }}/${{ inputs.source-directory }}
          SLICER_EXT_CMAKE_OPTIONS: ${{ inputs.cmake-options }}
        run: '"$SLICER_CI" extension-configure'

      - name: Build
        shell: bash
        run: '"$SLICER_CI" extension-build'

      - name: Package
        id: package
        if: inputs.package
        shell: bash
        run: '"$SLICER_CI" extension-package'

      # Before the tests, which may leave files in the tree.
      - name: Archive the build tree
        if: inputs.package && inputs.publish && inputs.publish-build-tree
        shell: bash
        env:
          SLICER_EXT_SOURCE_DIR: ${{ github.workspace }}/${{ inputs.source-directory }}
        run: '"$SLICER_CI" extension-tree'

      - name: Test
        id: tests
        if: inputs.run-tests
        continue-on-error: true
        shell: bash
        env:
          SLICER_EXT_SOURCE_DIR: ${{ github.workspace }}/${{ inputs.source-directory }}
        run: '"$SLICER_CI" extension-test'

      - name: Load in Slicer
        if: inputs.load-in-slicer
        shell: bash
        run: '"$SLICER_CI" extension-load'

      # Which Slicer the package was built against: the publish job puts it in
      # the release of that commit.
      - name: Describe the package
        if: inputs.package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          SLICER_COMMIT: ${{ steps.slicer.outputs.slicer-commit }}
          SLICER_REVISION: ${{ steps.slicer.outputs.slicer-revision }}
          # passed, failed, or not run: published with the package, which a
          # failing test does not withhold.
          TESTS: ${{ steps.tests.outcome == 'success' && 'passed' || steps.tests.outcome == 'failure' && 'failed' || 'not run' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd "$SLICER_OUTPUT_DIR"
          # A platform makes one kind of package: the other patterns match
          # nothing.
          files=(*.tar.gz *.zip *.dmg)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no package in $SLICER_OUTPUT_DIR"; exit 1; }
          packages="$(printf '%s\n' "${files[@]}" | jq -R . | jq -sc .)"
          # What it was built with (extension-dependencies), and its build
          # tree (extension-tree), when there are any.
          with='{}' tree='null'
          [ ! -f extension-built-with.json ] || with="$(tr -d '\r' < extension-built-with.json)"
          [ ! -f extension-tree.json ] || tree="$(tr -d '\r' < extension-tree.json)"
          jq -n --arg platform "$PLATFORM" --arg commit "$SLICER_COMMIT" --arg tests "$TESTS" \
                --arg revision "$SLICER_REVISION" --argjson packages "$packages" \
                --argjson with "$with" --argjson tree "$tree" \
            '{platform: $platform, slicer_commit: $commit, slicer_revision: $revision, tests: $tests, packages: $packages,
              depends: ($with.depends // []), built_with: ($with.built_with // {})}
             + (if $tree then {build_tree: $tree} else {} end)' \
            > "slicer-package-$PLATFORM.json"
          cat "slicer-package-$PLATFORM.json"

      - name: Upload the package
        if: inputs.package && inputs.upload-package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.setup.outputs.artifact-prefix }}-${{ matrix.platform }}
          path: |
            ${{ env.SLICER_OUTPUT_DIR }}/*.tar.gz
            ${{ env.SLICER_OUTPUT_DIR }}/*.zip
            ${{ env.SLICER_OUTPUT_DIR }}/*.dmg
            ${{ env.SLICER_OUTPUT_DIR }}/*-build-*.tar.zst
            ${{ env.SLICER_OUTPUT_DIR }}/slicer-package-*.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Upload the test results
        if: always() && inputs.run-tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.setup.outputs.artifact-prefix }}-test-results-${{ matrix.platform }}
          path: ${{ env.SLICER_OUTPUT_DIR }}/extension-test-results.xml
          retention-days: 7
          if-no-files-found: ignore

      # Last, so that a test failure still leaves the package and the results
      # uploaded.
      - name: Fail on test failures
        if: inputs.run-tests && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::the extension's tests failed"
          exit 1

  # The web platform: the extension built for SlicerWeb against the web build
  # tree of the Slicer release (slicerweb-build.tar.zst), in SlicerWeb's
  # toolchain container, with SlicerWeb's own extension stage, the way
  # SlicerWeb builds the extensions of its catalog.
  web:
    name: web
    needs: setup
    if: needs.setup.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.web-timeout-minutes }}
    env:
      SLICERWEB_ROOT: /home/runner/SW
      SLICERWEB_DIR: ${{ github.workspace }}/slicerweb
      SLICERWEB_CI: ${{ github.workspace }}/.slicer-actions/.github/scripts/slicerweb-ci.sh
      SLICER_CI: ${{ github.workspace }}/.slicer-actions/.github/scripts/slicer-ci.sh
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: extension
          submodules: ${{ inputs.submodules }}

      - name: Check out the Slicer actions
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ inputs.slicer-repository }}
          ref: ${{ inputs.slicer-ref }}
          path: .slicer-actions
          sparse-checkout: .github

      - name: Download the web build tree
        id: tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SLICER_REPOSITORY: ${{ inputs.slicer-repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          mkdir -p "$SLICERWEB_ROOT/restore"
          gh release download "$RELEASE_TAG" -R "$SLICER_REPOSITORY" -D "$SLICERWEB_ROOT/restore" --clobber \
            -p slicerweb-manifest.json -p 'slicerweb-build.tar.zst*'
          manifest="$SLICERWEB_ROOT/restore/slicerweb-manifest.json"
          cat "$manifest"
          {
            echo "slicerweb-repository=$(jq -r .slicerweb_repository "$manifest")"
            echo "slicerweb-commit=$(jq -r .slicerweb_commit "$manifest")"
            echo "slicer-commit=$(jq -r .commit "$manifest")"
          } >> "$GITHUB_OUTPUT"

      # The SlicerWeb the tree was built with: its toolchain, and its
      # extension stage.
      - name: Check out SlicerWeb
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ steps.tree.outputs.slicerweb-repository }}
          ref: ${{ steps.tree.outputs.slicerweb-commit }}
          path: slicerweb

      - name: Free disk space
        shell: bash
        run: bash "$SLICER_CI" free-disk-space

      - name: Build the toolchain image
        shell: bash
        run: bash "$SLICERWEB_CI" image

      - name: Restore the web build tree
        shell: bash
        run: bash "$SLICERWEB_CI" unpack "$SLICERWEB_ROOT/restore/slicerweb-build.tar.zst"

      - name: Build
        shell: bash
        env:
          NAME: ${{ needs.setup.outputs.extension-name }}
          SOURCE_DIRECTORY: ${{ inputs.source-directory }}
          SUBDIRECTORY: ${{ inputs.web-build-subdirectory }}
          # Where the dependencies come from, as for the desktop platforms.
          SLICER_EXT_REGISTRY: ${{ inputs.build-dependencies && format('https://github.com/{0}/releases/download/{1}/extension-repositories.json', inputs.slicer-repository, inputs.release-tag) || '' }}
          SLICER_COMMIT: ${{ steps.tree.outputs.slicer-commit }}
          SLICER_EXT_TREE: ${{ inputs.publish && inputs.publish-build-tree }}
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/extension"
          if [ "$SOURCE_DIRECTORY" != "." ]; then
            echo "::error::the web platform builds an extension at the top of its repository"
            exit 1
          fi
          bash "$SLICERWEB_CI" extension "$src" "$NAME" "$SLICERWEB_ROOT/out/package" "$SUBDIRECTORY"

      - name: Describe the package
        shell: bash
        env:
          SLICER_COMMIT: ${{ steps.tree.outputs.slicer-commit }}
        run: |
          set -euo pipefail
          cd "$SLICERWEB_ROOT/out/package"
          entry="$(cat extension-web.json)"
          # The icon is a file next to the wheel, or the address the extension
          # names (EXTENSION_ICONURL), which stays as it is.
          with='{}' tree='null'
          [ ! -f extension-built-with.json ] || with="$(cat extension-built-with.json)"
          [ ! -f extension-tree.json ] || tree="$(cat extension-tree.json)"
          jq -n --arg commit "$SLICER_COMMIT" --argjson entry "$entry" \
                --argjson with "$with" --argjson tree "$tree" \
            '{platform: "web", slicer_commit: $commit, slicer_revision: "",
              packages: ([$entry.wheel]
                         + (if ($entry.icon // "") != "" and ($entry.icon | contains("://") | not)
                            then [$entry.icon] else [] end)),
              depends: ($with.depends // []), built_with: ($with.built_with // {}),
              web: $entry}
             + (if $tree then {build_tree: $tree} else {} end)' > slicer-package-web.json
          rm -f extension-web.json extension-built-with.json extension-tree.json
          cat slicer-package-web.json
          {
            echo "### Web package"
            echo ""
            echo "Built against Slicer \`$SLICER_COMMIT\`: \`$(jq -r .wheel <<< "$entry")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the package
        if: inputs.upload-package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.setup.outputs.artifact-prefix }}-web
          path: ${{ env.SLICERWEB_ROOT }}/out/package/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.setup.outputs.artifact-prefix }}-logs-web
          path: ${{ env.SLICERWEB_ROOT }}/dist/logs
          retention-days: 7
          if-no-files-found: ignore

  # Publishing is off by default: an extension repository opts in, and the job
  # that calls this workflow has to grant `contents: write` for it, since a
  # called workflow cannot give itself more than its caller has.
  publish:
    name: Publish
    needs: [setup, build, web]
    # Not conditioned on every platform succeeding: a platform is published
    # when it built, packaged and loaded, which is when it uploaded its
    # package. Failing tests fail the run but withhold nothing, as for Slicer's
    # own nightly, and a platform that did not build keeps the package the
    # release had.
    if: ${{ !cancelled() && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two runs publishing the same platforms: one at a time, and neither over
    # a newer commit (below). Not across platforms, which do not touch each
    # other's files: of several jobs waiting in a group GitHub keeps one and
    # cancels the others, which would drop the platforms of those.
    concurrency:
      group: slicer-extension-publish-${{ github.repository }}-${{ inputs.platforms }}
      cancel-in-progress: false
    steps:
      - name: Download the packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ needs.setup.outputs.artifact-prefix }}-*
          path: downloaded
          merge-multiple: true

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # This job checks nothing out, so gh cannot infer the repository to
          # act on from a working tree.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.publish-tag }}
          NAME: ${{ needs.setup.outputs.extension-name }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, glob, hashlib, json, os, subprocess, sys, time

          tag, name = os.environ["TAG"], os.environ["NAME"]
          repository, commit = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]

          def gh(*args, check=True):
              return subprocess.run(["gh", *args], check=check, capture_output=True, text=True)

          # Not over a newer commit: the branch moved on while this was built,
          # and the build of its head publishes instead.
          head = gh("api", f"repos/{repository}/commits/{os.environ['REF']}", "--jq", ".sha", check=False).stdout.strip()
          if head and head != commit:
              print(f"::notice::{os.environ['REF']} is at {head[:10]} now, not {commit[:10]}; not published")
              sys.exit(0)

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as f:
                  for block in iter(lambda: f.read(1 << 20), b""):
                      digest.update(block)
              return digest.hexdigest()

          def files_of(entry):
              """The assets of a package."""
              tree = (entry or {}).get("build_tree") or {}
              return {f for f in [(entry or {}).get("file"), (entry or {}).get("icon"), *tree.get("files", [])] if f}

          descriptions = sorted(glob.glob("downloaded/slicer-package-*.json"))
          if not descriptions:
              print("::warning::no platform produced a package; nothing published")
              sys.exit(0)

          # The runs of the other platforms may be creating the release too.
          if gh("release", "view", tag, check=False).returncode != 0:
              gh("release", "create", tag, "--title", f"{name} {tag}", "--prerelease", "--latest=false",
                 "--notes", f"Packages of {name}.", check=False)
              for _ in range(5):
                  if gh("release", "view", tag, check=False).returncode == 0:
                      break
                  time.sleep(5)
          # What the release holds: the description of each platform. Only
          # those of the platforms this run built are written.
          os.makedirs("release", exist_ok=True)
          gh("release", "download", tag, "-p", "extension-*.json", "-D", "release", "--clobber", check=False)

          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S+00:00")
          for description in descriptions:
              package = json.load(open(description, encoding="utf8"))
              platform = package["platform"]
              files = package["packages"]
              entry = {
                  "file": files[0],
                  "sha256": sha256(os.path.join("downloaded", files[0])),
                  "revision": commit,
                  "date": date,
                  "slicer_commit": package["slicer_commit"],
              }
              if package.get("slicer_revision"):
                  entry["slicer_revision"] = package["slicer_revision"]
              if package.get("tests"):
                  entry["tests"] = package["tests"]
              if len(files) > 1:
                  entry["icon"] = files[1]
              entry["depends"] = package.get("depends") or []
              entry["built_with"] = package.get("built_with") or {}
              tree = package.get("build_tree")
              if tree:
                  entry["build_tree"] = dict(tree, sha256={f: sha256(os.path.join("downloaded", f)) for f in tree["files"]})

              path = f"release/extension-{platform}.json"
              described = json.load(open(path, encoding="utf8")) if os.path.isfile(path) else {}
              old, previous = described.get("package"), described.get("previous")
              # The package the platform had. Built against another Slicer, it
              # is kept as the previous one, for the Slicer builds that are
              # still offered it, in place of the one before it; without its
              # build tree, which nothing is built against any more.
              if old and old.get("slicer_commit") != entry["slicer_commit"]:
                  superseded = files_of(previous) | set((old.get("build_tree") or {}).get("files", []))
                  previous = {k: v for k, v in old.items() if k != "build_tree"}
              else:
                  superseded = files_of(old)
              uploads = sorted(files_of(entry))
              # A file name that does not change from one build to the next (a
              # wheel's) now holds the new package: there is no previous one.
              if files_of(previous) & set(uploads):
                  previous = None
              described = {"name": name, "repository": repository, "platform": platform, "date": date,
                           "package": entry, "previous": previous}
              if platform == "web":
                  described["web"] = package["web"]
              with open(path, "w", encoding="utf8") as f:
                  json.dump(described, f, indent=1)
              print(json.dumps(described, indent=1))
              # The package first, its description, which names it, last.
              gh("release", "upload", tag, *[os.path.join("downloaded", f) for f in uploads], "--clobber")
              gh("release", "upload", tag, path, "--clobber")
              for stale in sorted(superseded - set(uploads) - files_of(previous)):
                  print(f"Removing the superseded asset {stale}")
                  gh("release", "delete-asset", tag, stale, "--yes", check=False)

          # The description of all the platforms in one file, of before there
          # was one per platform.
          gh("release", "delete-asset", tag, "extension.json", "--yes", check=False)

          # The notes say what each package was built against.
          lines = []
          for path in sorted(glob.glob("release/extension-*.json")):
              described = json.load(open(path, encoding="utf8"))
              entry = described.get("package") or {}
              line = f"- {described.get('platform')}: `{str(entry.get('revision'))[:10]}`, Slicer `{entry.get('slicer_commit')}`"
              if entry.get("slicer_revision"):
                  line += f" (r{entry['slicer_revision']})"
              for dependency, used in sorted((entry.get("built_with") or {}).items()):
                  line += f", {dependency} `{str(used.get('revision'))[:10]}`"
              if entry.get("tests") == "failed":
                  line += ", tests failed"
              lines.append(f"{line}: {entry.get('file')}")
          notes = (f"Packages of {name}: what each was built from, and against which Slicer and which of the"
                   " extensions it depends on.\n\n" + "\n".join(lines) + "\n\n"
                   "extension-<platform>.json says the same, for the catalog of the Slicer release, which\n"
                   "the Extensions Managers read.")
          gh("release", "edit", tag, "--notes", notes, "--latest=false", "--prerelease", check=False)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"Published {', '.join(json.load(open(d))['platform'] for d in descriptions)} to the release {tag}.\n")
          PY
