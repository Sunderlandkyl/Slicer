name: Extension build (self-test)

# Verifies that a build tree published by the "Build" workflow can be used by a
# separate repository to build an extension. It builds the extension templates
# shipped in `Extensions/Testing` exactly the way an extension repository would.
#
# This is the reference implementation for extension repositories: see
# `Docs/developer_guide/build_instructions/github_actions.md`.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to test (comma separated)"
        default: "linux"
      release-tag:
        description: "Release tag holding the Slicer build to test against"
        default: "nightly"
      repository:
        description: "Repository publishing the Slicer release"
        default: ""
  push:
    branches:
      - "ci/**"
  schedule:
    # A few hours after the nightly build.
    - cron: "0 10 * * *"

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      found: ${{ steps.matrix.outputs.found }}
    steps:
      - name: Compute matrix
        id: matrix
        shell: bash
        env:
          PLATFORMS: ${{ github.event.inputs.platforms || 'linux' }}
          REPOSITORY: ${{ github.event.inputs.repository || github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.release-tag || 'nightly' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Nothing to test until a Slicer build has been published.
          if ! gh release view "$RELEASE_TAG" -R "$REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::No '$RELEASE_TAG' release in $REPOSITORY; nothing to test."
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          entries=""
          for p in ${PLATFORMS//,/ }; do
            case "$p" in
              linux)   entries="$entries {\"platform\":\"linux\",\"runner\":\"ubuntu-22.04\"}," ;;
              macos)   entries="$entries {\"platform\":\"macos\",\"runner\":\"macos-15\"}," ;;
              windows) entries="$entries {\"platform\":\"windows\",\"runner\":\"windows-2022\"}," ;;
            esac
          done
          echo "matrix={\"include\":[${entries%,}]}" >> "$GITHUB_OUTPUT"

  build-extension:
    name: ${{ matrix.extension }} (${{ matrix.platform }})
    needs: setup
    if: needs.setup.outputs.found == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        extension:
          - LoadableExtensionTemplate
          - ScriptedLoadableExtensionTemplate
          - CLIExtensionTemplate
        include: ${{ fromJSON(needs.setup.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # An extension repository would use:
      #   uses: Slicer/Slicer/.github/actions/setup-slicer-build@main
      - name: Set up the Slicer build
        id: slicer
        uses: ./.github/actions/slicer-env
        with:
          repository: ${{ github.event.inputs.repository || github.repository }}
          build-source: release
          build-release-tag: ${{ github.event.inputs.release-tag || 'nightly' }}
          deps-source: release
          deps-release-tag: ${{ github.event.inputs.release-tag || 'nightly' }}
          free-disk-space: ${{ matrix.platform == 'linux' }}

      - name: Configure and build ${{ matrix.extension }}
        shell: bash
        run: |
          set -euo pipefail
          src="${{ steps.slicer.outputs.source-dir }}/Extensions/Testing/${{ matrix.extension }}"
          build="$SLICER_ROOT/ext-build"
          rm -rf "$build"
          args=(-S "$src" -B "$build" "-DSlicer_DIR:PATH=${{ steps.slicer.outputs.slicer-dir }}")
          if [ "$SLICER_PLATFORM" = "windows" ]; then
            args+=(-G "Visual Studio 17 2022" -A x64)
          else
            args+=(-G Ninja -DCMAKE_BUILD_TYPE:STRING=Release)
          fi
          cmake "${args[@]}"
          cmake --build "$build" --parallel ${{ matrix.platform == 'windows' && '--config Release' || '' }}

      - name: Package ${{ matrix.extension }}
        shell: bash
        run: |
          set -euo pipefail
          build="$SLICER_ROOT/ext-build"
          cmake --build "$build" --target package ${{ matrix.platform == 'windows' && '--config Release' || '' }}
          find "$build" -maxdepth 2 -name '*.tar.gz' -o -maxdepth 2 -name '*.zip' -o -maxdepth 2 -name '*.dmg' | head

      - name: Load the extension in Slicer
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          launcher="${{ steps.slicer.outputs.slicer-dir }}/Slicer"
          build="$SLICER_ROOT/ext-build"
          export QTWEBENGINE_DISABLE_SANDBOX=1 LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a "$launcher" --no-splash --no-main-window --ignore-slicerrc \
            --additional-module-paths "$build" \
            --python-code "import slicer; print('modules:', len(slicer.app.moduleManager().modulesNames())); exit(slicer.util.EXIT_SUCCESS)"
