name: Build

# Builds Slicer on Linux, macOS and Windows, and for the web browser
# (SlicerWeb): decides what to build and calls build-application.yml, each
# platform of which publishes what it built to the nightly release.
# See Docs/developer_guide/build_instructions/github_actions.md

on:
  push:
    branches:
      - "main"
      - "master"
      # Branches used to develop the CI itself.
      - "ci/**"
  pull_request:
  schedule:
    # Nightly, after the preview branch has been updated. GitHub starts
    # scheduled runs late, so the relay (.github/extension-webhook) starts the
    # nightly on time; a run started here later finds it built and stops.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma separated: linux,macos,macos-arm64,windows,web)"
        default: "linux,macos,macos-arm64,windows,web"
      run-tests:
        description: "Run the test suite"
        type: boolean
        default: true
      publish:
        description: "Publish the build trees to the 'nightly' release"
        type: boolean
        default: false
      rebuild-prerequisites:
        description: "Force a rebuild of the prerequisites"
        type: boolean
        default: false
      nightly:
        description: "Run as the scheduled nightly does: publish, build nothing when the nightly release already holds this commit, and let failing tests withhold nothing"
        type: boolean
        default: false
      force:
        description: "Build even if the nightly release already holds this commit"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  Setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
      run-tests: ${{ steps.matrix.outputs.run-tests }}
      publish: ${{ steps.matrix.outputs.publish }}
      force-deps: ${{ steps.matrix.outputs.force-deps }}
      skip: ${{ steps.uptodate.outputs.skip }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Decide what to build
        id: matrix
        shell: bash
        env:
          # web with the desktop platforms, so that every platform of the
          # nightly comes from the same commit, and extensions are built for
          # all of them against it.
          PLATFORMS: ${{ github.event.inputs.platforms || 'linux,macos,macos-arm64,windows,web' }}
          # A manual run with the nightly input is the scheduled run, started
          # by something that keeps time.
          EVENT: ${{ github.event.inputs.nightly == 'true' && 'schedule' || github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Platforms built by a push to a branch other than the default one.
          # Set the SLICER_CI_PLATFORMS repository variable to work on a single
          # platform while developing the CI itself.
          SLICER_CI_PLATFORMS: ${{ vars.SLICER_CI_PLATFORMS }}
          # Publish from a branch other than the default one. Only for bringing
          # up the CI itself, when the nightly release has to exist before the
          # workflow has been merged.
          SLICER_CI_PUBLISH: ${{ vars.SLICER_CI_PUBLISH }}
        run: |
          set -euo pipefail
          on_default_branch=false
          if [ "$EVENT" = "push" ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            on_default_branch=true
          fi
          # A pull request builds Linux and the web, which gives it a package
          # and a web runtime to try within the hour, and the branches used to
          # develop the CI itself build Linux: fast feedback at a low cost.
          if [ "$EVENT" = "pull_request" ]; then
            PLATFORMS="linux,web"
          elif [ "$EVENT" = "push" ] && [ "$on_default_branch" = "false" ]; then
            PLATFORMS="${SLICER_CI_PLATFORMS:-linux}"
          fi
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"
          echo "Platforms: $PLATFORMS"
          run_tests="${{ github.event.inputs.run-tests || 'true' }}"
          echo "run-tests=$run_tests" >> "$GITHUB_OUTPUT"
          publish="${{ github.event.inputs.publish || 'false' }}"
          # Every build of the default branch, and the nightly run, publish.
          # SLICER_CI_PUBLISH applies to pushes only, not to manual runs.
          if [ "$EVENT" = "schedule" ] || [ "$on_default_branch" = "true" ] \
            || { [ "$EVENT" = "push" ] && [ "${SLICER_CI_PUBLISH:-}" = "true" ]; }; then
            publish="true"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "force-deps=${{ github.event.inputs.rebuild-prerequisites || 'false' }}" >> "$GITHUB_OUTPUT"

      # When no commit has landed since the last nightly, the scheduled run has
      # nothing to publish and several hours of runner time to save.
      - name: Check whether nightly is up to date
        id: uptodate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event.inputs.nightly == 'true' && 'schedule' || github.event_name }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          RELEASE_TAG: nightly
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT" = "schedule" ] && [ "$FORCE" != "true" ]; then
            dir="$(mktemp -d)"
            if gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -D "$dir" \
                 --clobber -p 'manifest-*.json' 2>/dev/null; then
              built="$(cat "$dir"/manifest-*.json 2>/dev/null \
                       | sed -n 's/^  "commit": "\(.*\)",$/\1/p' | sort -u)"
              echo "Commit of the published nightly: ${built:-none}"
              echo "Commit of the default branch:    $GITHUB_SHA"
              if [ "$built" = "$GITHUB_SHA" ]; then
                skip=true
              fi
            else
              echo "No '$RELEASE_TAG' release yet."
            fi
            rm -rf "$dir"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = "true" ]; then
            echo "::notice::The nightly release already holds $GITHUB_SHA; nothing to build."
            {
              echo "### Nothing to build"
              echo ""
              echo "The nightly release already holds \`$GITHUB_SHA\`."
              echo "Run the workflow manually with \`force\` to build it again."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  Build:
    name: Build
    needs: Setup
    if: needs.Setup.outputs.skip != 'true'
    uses: ./.github/workflows/build-application.yml
    permissions:
      # The prerequisites are stored on the nightly release.
      contents: write
      # Each platform attests the package it publishes.
      id-token: write
      attestations: write
    secrets: inherit
    with:
      name: Slicer
      platforms: ${{ needs.Setup.outputs.platforms }}
      # The web runtime is built from this very commit of Slicer. Until the
      # change letting it override the Slicer revision is in SlicerWeb, the
      # fork that has it is the default.
      slicerweb-repository: ${{ vars.SLICERWEB_REPOSITORY || 'Sunderlandkyl/SlicerWeb' }}
      slicerweb-ref: ${{ vars.SLICERWEB_REF || 'ci/slicer-actions' }}
      web-slicer-from-checkout: true
      ci-repository: ${{ github.repository }}
      ci-ref: ${{ github.sha }}
      qt-version: ${{ vars.SLICER_CI_QT_VERSION || '5.15.2' }}
      rebuild-prerequisites: ${{ needs.Setup.outputs.force-deps == 'true' }}
      # The repository has a single release: the prerequisites are kept on
      # the nightly one.
      prerequisites-release: nightly
      prerequisites-release-title: Slicer nightly
      run-tests: ${{ needs.Setup.outputs.run-tests == 'true' }}
      test-exclude: ${{ vars.SLICER_CI_TEST_EXCLUDE }}
      # The nightly run publishes packages even when tests fail.
      fail-on-test-failures: ${{ github.event_name != 'schedule' && github.event.inputs.nightly != 'true' }}
      archive-build-trees: ${{ needs.Setup.outputs.publish == 'true' }}
      publish-release: ${{ needs.Setup.outputs.publish == 'true' && 'nightly' || '' }}
      # extension-reconcile.yml listens to it.
      publish-dispatch-event: reconcile-extensions
      release-notes: |
        Nightly Slicer build trees and packages.

        Extension repositories can build against this nightly with the
        `Slicer/Slicer/.github/actions/setup-slicer-build` action.
        See `Docs/developer_guide/build_instructions/github_actions.md`.

        `slicerweb-wheels.zip` is the WebAssembly runtime of SlicerWeb
        (https://github.com/lassoan/SlicerWeb), the wheels.zip a SlicerWeb site
        is built from; `slicerweb-build.tar.zst` is the build tree it comes
        from, which web extensions are built against, and
        `slicerweb-manifest.json` what it was built from.

        `extensions-catalog.json` lists the extensions built against these
        builds, by their own repositories, that are consistent with each other.

        The `slicer-deps-<platform>-<key>` assets are the prebuilt
        prerequisites that the Build workflow reuses between runs.
      macos-signing-identity: ${{ vars.MACOS_SIGNING_IDENTITY }}
