name: Build

# Builds Slicer on Linux, macOS and Windows.
#
# The build is split in two phases so that it fits within the GitHub-hosted
# runner limits (6 h per job) and so that the expensive part is done only when
# it actually changes:
#
#   1. "prerequisites": builds the external projects of the Superbuild
#      (VTK, ITK, CTK, Python, DCMTK, ...) through the `Slicer-dependencies`
#      target. The result is keyed on the content of `SuperBuild/` so it is
#      reused, untouched, by every later run.
#   2. "slicer": restores the prerequisites and builds the inner `Slicer`
#      target, then packages and tests it.
#
# The Superbuild structure is preserved: phase 2 runs the very same superbuild
# tree, and the external projects are simply already up to date.

on:
  push:
    branches:
      - "main"
      - "master"
      # Branches used to develop the CI itself.
      - "ci/**"
  pull_request:
    branches:
      - "*"
  schedule:
    # Nightly, after the preview branch has been updated.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma separated: linux,macos,windows)"
        default: "linux,macos,windows"
      run-tests:
        description: "Run the test suite"
        type: boolean
        default: true
      publish:
        description: "Publish the build trees to the 'nightly' release"
        type: boolean
        default: false
      rebuild-prerequisites:
        description: "Force a rebuild of the prerequisites"
        type: boolean
        default: false
      force:
        description: "Build even if the nightly release already holds this commit"
        type: boolean
        default: false
      notify-only:
        description: "Build nothing; only start the extension builds against the published nightly"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Bump to force a rebuild of the prerequisites of every platform.
  SLICER_DEPS_KEY_VERSION: "1"
  # Qt version used to build Slicer. Override with the SLICER_CI_QT_VERSION
  # repository variable.
  SLICER_CI_QT_VERSION: ${{ vars.SLICER_CI_QT_VERSION || '5.15.2' }}

jobs:
  #-----------------------------------------------------------------------------
  # Decide what to build.
  #-----------------------------------------------------------------------------
  setup:
    name: Setup
    # Every other job but notify depends on this one, so skipping it builds
    # and publishes nothing.
    if: ${{ !inputs.notify-only }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      run-tests: ${{ steps.matrix.outputs.run-tests }}
      publish: ${{ steps.matrix.outputs.publish }}
      force-deps: ${{ steps.matrix.outputs.force-deps }}
      skip: ${{ steps.uptodate.outputs.skip }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Compute matrix
        id: matrix
        shell: bash
        env:
          PLATFORMS: ${{ github.event.inputs.platforms || 'linux,macos,windows' }}
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Platforms built by a push to a branch other than the default one.
          # Set the SLICER_CI_PLATFORMS repository variable to work on a single
          # platform while developing the CI itself.
          SLICER_CI_PLATFORMS: ${{ vars.SLICER_CI_PLATFORMS }}
          # Publish from a branch other than the default one. Only for bringing
          # up the CI itself, when the nightly release has to exist before the
          # workflow has been merged.
          SLICER_CI_PUBLISH: ${{ vars.SLICER_CI_PUBLISH }}
        run: |
          set -euo pipefail
          on_default_branch=false
          if [ "$EVENT" = "push" ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            on_default_branch=true
          fi
          # Only Linux is built on pull requests and on the branches used to
          # develop the CI itself, to keep the feedback fast and the cost low.
          # The default branch, the nightly run and manual runs build
          # everything.
          if [ "$EVENT" = "pull_request" ]; then
            PLATFORMS="linux"
          elif [ "$EVENT" = "push" ] && [ "$on_default_branch" = "false" ]; then
            PLATFORMS="${SLICER_CI_PLATFORMS:-linux}"
          fi
          entries=""
          for p in ${PLATFORMS//,/ }; do
            case "$p" in
              linux)   entries="$entries {\"platform\":\"linux\",\"runner\":\"ubuntu-22.04\"}," ;;
              macos)   entries="$entries {\"platform\":\"macos\",\"runner\":\"macos-15-intel\"}," ;;
              windows) entries="$entries {\"platform\":\"windows\",\"runner\":\"windows-2022\"}," ;;
              *) echo "::warning::unknown platform '$p'" ;;
            esac
          done
          matrix="{\"include\":[${entries%,}]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"
          run_tests="${{ github.event.inputs.run-tests || 'true' }}"
          echo "run-tests=$run_tests" >> "$GITHUB_OUTPUT"
          publish="${{ github.event.inputs.publish || 'false' }}"
          # The nightly release follows the default branch: every build of it,
          # and the nightly run itself, refresh what extension repositories
          # build against.
          if [ "$EVENT" = "schedule" ] || [ "$on_default_branch" = "true" ] \
            || [ "${SLICER_CI_PUBLISH:-}" = "true" ]; then
            publish="true"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "force-deps=${{ github.event.inputs.rebuild-prerequisites || 'false' }}" >> "$GITHUB_OUTPUT"

      # The scheduled run exists to keep the nightly release in step with the
      # default branch. When no commit has landed since the last one, there is
      # nothing to publish and several hours of runner time to save.
      - name: Check whether the nightly is up to date
        id: uptodate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          RELEASE_TAG: nightly
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT" = "schedule" ] && [ "$FORCE" != "true" ]; then
            dir="$(mktemp -d)"
            if gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -D "$dir" \
                 --clobber -p 'manifest-*.json' 2>/dev/null; then
              built="$(cat "$dir"/manifest-*.json 2>/dev/null \
                       | sed -n 's/^  "commit": "\(.*\)",$/\1/p' | sort -u)"
              echo "Commit of the published nightly: ${built:-none}"
              echo "Commit of the default branch:    $GITHUB_SHA"
              if [ "$built" = "$GITHUB_SHA" ]; then
                skip=true
              fi
            else
              echo "No '$RELEASE_TAG' release yet."
            fi
            rm -rf "$dir"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = "true" ]; then
            echo "::notice::The nightly release already holds $GITHUB_SHA; nothing to build."
            {
              echo "### Nothing to build"
              echo ""
              echo "The nightly release already holds \`$GITHUB_SHA\`."
              echo "Run the workflow manually with \`force\` to build it again."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  #-----------------------------------------------------------------------------
  # Phase 1: build (or reuse) the prerequisites.
  #
  # A full build of the external projects does not fit in the 6 h limit of a
  # GitHub-hosted job, so it is split in several stages chained through
  # artifacts. Each stage builds a group of external projects in the superbuild
  # tree produced by the previous one.
  #
  # The result is stored as the assets of a release named after a key computed
  # from the files describing the external projects. Later runs restore it
  # instead of rebuilding, and rebuild only when an external project changes.
  #-----------------------------------------------------------------------------
  deps-key:
    name: Prerequisites key
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      # The matrix, with the prerequisites key and whether it has already been
      # built added to every entry.
      matrix: ${{ steps.key.outputs.matrix }}
      # The subset of the entries whose prerequisites still have to be built,
      # and how many there are. The stages are gated on the count: a matrix
      # whose only vector is an empty "include" is rejected by GitHub, so the
      # output falls back to the full matrix and the jobs are skipped by their
      # condition instead.
      matrix-todo: ${{ steps.key.outputs.matrix-todo }}
      todo-count: ${{ steps.key.outputs.todo-count }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Compute keys
        id: key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ needs.setup.outputs.force-deps }}
          MATRIX: ${{ needs.setup.outputs.matrix }}
          QT_VERSION: ${{ env.SLICER_CI_QT_VERSION }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/slicer-ci.sh
          entries="[]"
          {
            echo "### Prerequisites"
            echo ""
            echo "| Platform | Key | Already built |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r platform runner; do
            [ -n "$platform" ] || continue
            key="slicer-deps-${platform}-$(
              SLICER_PLATFORM="$platform" \
              SLICER_RUNNER_IMAGE="$runner" \
              SLICER_QT_VERSION="$QT_VERSION" \
              SLICER_SOURCE_DIR="$GITHUB_WORKSPACE" \
              .github/scripts/slicer-ci.sh deps-key)"
            cached=false
            if [ "$FORCE" != "true" ] && gh release view "$key" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              cached=true
            fi
            entries="$(echo "$entries" | jq -c \
              --arg p "$platform" --arg r "$runner" --arg k "$key" --argjson c "$cached" \
              '. + [{platform: $p, runner: $r, key: $k, cached: $c}]')"
            echo "| $platform | \`$key\` | $cached |" >> "$GITHUB_STEP_SUMMARY"
          done < <(echo "$MATRIX" | jq -r '.include[] | "\(.platform) \(.runner)"')
          todo="$(echo "$entries" | jq -c 'map(select(.cached | not))')"
          count="$(echo "$todo" | jq 'length')"
          if [ "$count" -eq 0 ]; then
            # Never emit an empty "include": the stages are skipped by their
            # condition, and this value is then never used.
            todo="$entries"
          fi
          echo "matrix=$(echo "$entries" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "matrix-todo=$(echo "$todo" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "todo-count=$count" >> "$GITHUB_OUTPUT"
          echo "Platforms whose prerequisites have to be built: $count"
          echo "$entries" | jq .

  deps-1:
    name: "Deps 1/5: what VTK and ITK need (${{ matrix.platform }})"
    needs: [setup, deps-key]
    if: needs.deps-key.outputs.todo-count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      SLICER_STAGE_NAME: "Deps 1/5: what VTK and ITK need"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.deps-key.outputs.matrix-todo) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up environment
        uses: ./.github/actions/slicer-env
        with:
          qt-version: ${{ env.SLICER_CI_QT_VERSION }}
          # The prerequisites are built once and then stored as a release, so
          # caching their objects would only displace the entries that speed
          # up the Slicer build itself.
          compiler-cache: "false"
      - name: Build base
        uses: ./.github/actions/slicer-build-stage
        with:
          # The dependencies of VTK and ITK, and nothing else. Naming their
          # prerequisites rather than a hand-picked list keeps this stage
          # derivable from the graph: `python` brings in zlib, bzip2, LZMA,
          # LibFFI, sqlite and OpenSSL, `DCMTK` brings in OpenJPEG.
          #
          # Anything that merely *uses* VTK or ITK belongs in the last stage.
          # Naming such a project here would build the whole of VTK in this
          # stage instead, which is what teem used to do.
          target: "python DCMTK tbb"
          archive-paths: "SR Slicer"
          archive-name: deps-stage
          upload-artifact: deps-stage1-${{ matrix.platform }}

  deps-2:
    name: "Deps 2/5: VTK (${{ matrix.platform }})"
    needs: [setup, deps-key, deps-1]
    if: needs.deps-key.outputs.todo-count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      SLICER_STAGE_NAME: "Deps 2/5: VTK"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.deps-key.outputs.matrix-todo) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up environment
        uses: ./.github/actions/slicer-env
        with:
          qt-version: ${{ env.SLICER_CI_QT_VERSION }}
          # The prerequisites are built once and then stored as a release, so
          # caching their objects would only displace the entries that speed
          # up the Slicer build itself.
          compiler-cache: "false"
      - name: Build VTK
        uses: ./.github/actions/slicer-build-stage
        with:
          target: "VTK"
          restore-artifact: deps-stage1-${{ matrix.platform }}
          restore-archive: deps-stage
          archive-paths: "SR Slicer"
          archive-name: deps-stage
          upload-artifact: deps-stage2-${{ matrix.platform }}

  deps-3:
    name: "Deps 3/5: ITK (${{ matrix.platform }})"
    needs: [setup, deps-key, deps-2]
    if: needs.deps-key.outputs.todo-count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      SLICER_STAGE_NAME: "Deps 3/5: ITK"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.deps-key.outputs.matrix-todo) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up environment
        uses: ./.github/actions/slicer-env
        with:
          qt-version: ${{ env.SLICER_CI_QT_VERSION }}
          # The prerequisites are built once and then stored as a release, so
          # caching their objects would only displace the entries that speed
          # up the Slicer build itself.
          compiler-cache: "false"
      - name: Build ITK
        uses: ./.github/actions/slicer-build-stage
        with:
          # ITK needs VTK, because Slicer enables ITKVtkGlue.
          target: "ITK"
          restore-artifact: deps-stage2-${{ matrix.platform }}
          restore-archive: deps-stage
          archive-paths: "SR Slicer"
          archive-name: deps-stage
          upload-artifact: deps-stage3-${{ matrix.platform }}

  deps-4:
    name: "Deps 4/5: CTK (${{ matrix.platform }})"
    needs: [setup, deps-key, deps-3]
    if: needs.deps-key.outputs.todo-count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      SLICER_STAGE_NAME: "Deps 4/5: CTK"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.deps-key.outputs.matrix-todo) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up environment
        uses: ./.github/actions/slicer-env
        with:
          qt-version: ${{ env.SLICER_CI_QT_VERSION }}
          # The prerequisites are built once and then stored as a release, so
          # caching their objects would only displace the entries that speed
          # up the Slicer build itself.
          compiler-cache: "false"
      - name: Build CTK
        uses: ./.github/actions/slicer-build-stage
        with:
          # CTK needs VTK, ITK, Python and DCMTK, so it comes last on the
          # critical path. It brings in PythonQt and QtTesting.
          target: "CTK"
          restore-artifact: deps-stage3-${{ matrix.platform }}
          restore-archive: deps-stage
          archive-paths: "SR Slicer"
          archive-name: deps-stage
          upload-artifact: deps-stage4-${{ matrix.platform }}

  deps-5:
    name: "Deps 5/5: everything else (${{ matrix.platform }})"
    needs: [setup, deps-key, deps-4]
    if: needs.deps-key.outputs.todo-count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      SLICER_STAGE_NAME: "Deps 5/5: everything else"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.deps-key.outputs.matrix-todo) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up environment
        uses: ./.github/actions/slicer-env
        with:
          qt-version: ${{ env.SLICER_CI_QT_VERSION }}
          # The prerequisites are built once and then stored as a release, so
          # caching their objects would only displace the entries that speed
          # up the Slicer build itself.
          compiler-cache: "false"
      - name: Build rest
        uses: ./.github/actions/slicer-build-stage
        with:
          # Everything that was not on the critical path: teem, curl,
          # LibArchive, RapidJSON, JsonCpp, SlicerExecutionModel, qRestAPI, the
          # launcher, SimpleITK, the Python packages and the sources of the
          # remote modules. Whatever is added to the superbuild lands here
          # unless VTK or ITK needs it.
          target: "Slicer-dependencies"
          restore-artifact: deps-stage4-${{ matrix.platform }}
          restore-archive: deps-stage
          archive-paths: "SR"
          archive-name: deps-${{ matrix.platform }}
          upload-artifact: deps-${{ matrix.platform }}

      - name: Publish the prerequisites
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          "$SLICER_CI" split "$SLICER_OUTPUT_DIR/deps-${SLICER_PLATFORM}.tar.zst"
          gh release create "$KEY" --title "$KEY" --prerelease --latest=false \
            --notes "Prebuilt Slicer prerequisites for ${SLICER_PLATFORM}, produced by the Build workflow. Safe to delete: it is regenerated on demand." \
            2>/dev/null || true
          gh release upload "$KEY" "$SLICER_OUTPUT_DIR"/deps-${SLICER_PLATFORM}.tar.zst* --clobber

          # Keep the three most recent sets of prerequisites of this platform;
          # older ones correspond to external projects nothing builds any more.
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"slicer-deps-${SLICER_PLATFORM}-\"))]
                  | sort_by(.createdAt) | reverse | .[3:] | .[].tagName" \
            | while read -r old; do
                [ -n "$old" ] || continue
                echo "Removing the superseded prerequisites $old"
                gh release delete "$old" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
              done

  # Single place stating whether the prerequisites of every platform are
  # available: either they were already built, or the stages produced them.
  # The stage jobs are skipped both when there is nothing to build and when an
  # earlier stage failed, so their result alone cannot be relied upon.
  deps:
    name: Prerequisites ready
    needs: [deps-key, deps-5]
    if: always() && needs.deps-key.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check
        shell: bash
        env:
          TODO: ${{ needs.deps-key.outputs.todo-count }}
          RESULT: ${{ needs.deps-5.result }}
        run: |
          set -euo pipefail
          todo="$TODO"
          echo "Platforms needing a build of the prerequisites: $todo"
          echo "Result of the last stage: $RESULT"
          if [ "$todo" -eq 0 ]; then
            echo "All prerequisites were already available."
            exit 0
          fi
          if [ "$RESULT" != "success" ]; then
            echo "::error::Building the prerequisites did not succeed ($RESULT)."
            exit 1
          fi

  #-----------------------------------------------------------------------------
  # Phase 2: build Slicer itself, package it and run the tests.
  #-----------------------------------------------------------------------------
  slicer:
    name: Slicer (${{ matrix.platform }})
    needs: [setup, deps-key, deps]
    # The stages are skipped when the prerequisites are already available, and
    # GitHub carries that skip down the whole graph, past the gate job that ran
    # and succeeded. Stating a condition here is what stops it.
    if: ${{ !cancelled() && needs.deps.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    outputs:
      revision: ${{ steps.package.outputs.revision }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.deps-key.outputs.matrix) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up environment
        id: env
        uses: ./.github/actions/slicer-env
        with:
          qt-version: ${{ env.SLICER_CI_QT_VERSION }}

      # Restore and save are separate so the save can run even when the job
      # fails. actions/cache only saves after a successful job, and this job
      # fails whenever a test fails, so the test data was never cached and
      # every run downloaded the whole set again.
      - name: Restore the test data
        id: testdata
        uses: actions/cache/restore@640a1c2554105b57832a23eea0b4672fc7a790d5 # v4.2.3
        with:
          path: ${{ env.SLICER_ROOT }}/ExternalData
          key: slicer-testdata-${{ matrix.platform }}-${{ hashFiles('**/*.md5', '**/*.sha256', '**/*.sha512') }}
          restore-keys: slicer-testdata-${{ matrix.platform }}-

      - name: Download the prerequisites
        if: matrix.cached
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          mkdir -p "$SLICER_OUTPUT_DIR/restore"
          gh release download "$KEY" -R "$GITHUB_REPOSITORY" -D "$SLICER_OUTPUT_DIR/restore" --clobber \
            -p "deps-${SLICER_PLATFORM}.tar.zst*"
          "$SLICER_CI" unpack "$SLICER_OUTPUT_DIR/restore/deps-${SLICER_PLATFORM}.tar.zst"
          rm -rf "$SLICER_OUTPUT_DIR/restore"

      # Signing with a Developer ID, and notarizing, happen only when the
      # secrets exist. Without them the bundle is signed ad-hoc, which runs
      # locally but shows Gatekeeper's warning. See
      # Docs/developer_guide/build_instructions/github_actions.md
      - name: Import the signing certificate
        id: signing
        if: matrix.platform == 'macos' && env.MACOS_CERTIFICATE != ''
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/slicer-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "SLICER_CODESIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Signing with: $MACOS_SIGNING_IDENTITY"

      - name: Build Slicer
        uses: ./.github/actions/slicer-build-stage
        with:
          target: Slicer
          # `a && b || c` returns c whenever b is falsy, so the empty string
          # has to be the last operand.
          restore-artifact: ${{ !matrix.cached && format('deps-{0}', matrix.platform) || '' }}
          restore-archive: deps-${{ matrix.platform }}
          # Archived after the tests and the packaging instead.
          archive-name: ""

      - name: Summarize the prerequisites
        if: always()
        shell: bash
        run: '"$SLICER_CI" stage-summary'

      - name: Save the test data
        if: always() && steps.testdata.outputs.cache-hit != 'true'
        uses: actions/cache/save@640a1c2554105b57832a23eea0b4672fc7a790d5 # v4.2.3
        with:
          path: ${{ env.SLICER_ROOT }}/ExternalData
          key: ${{ steps.testdata.outputs.cache-primary-key }}

      - name: Install software OpenGL
        if: needs.setup.outputs.run-tests == 'true' && matrix.platform == 'windows'
        shell: bash
        run: '"$SLICER_CI" install-software-opengl'

      - name: Run the tests
        id: tests
        if: needs.setup.outputs.run-tests == 'true'
        continue-on-error: true
        shell: bash
        env:
          SLICER_CTEST_EXCLUDE: ${{ vars.SLICER_CI_TEST_EXCLUDE }}
        run: '"$SLICER_CI" test'

      - name: Summarize the tests
        if: always() && needs.setup.outputs.run-tests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/test-summary.py" \
            "$SLICER_OUTPUT_DIR/test-results.xml" "(${{ matrix.platform }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test results
        if: always() && needs.setup.outputs.run-tests == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.platform }}
          path: |
            ${{ env.SLICER_OUTPUT_DIR }}/test-results.xml
            ${{ env.SLICER_OUTPUT_DIR }}/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Package
        id: package
        shell: bash
        run: '"$SLICER_CI" package'

      # A bundle whose install names were not rewritten builds and packages
      # cleanly, and only fails on a user's machine. Check before publishing.
      - name: Verify the package
        id: verify
        continue-on-error: true
        shell: bash
        run: '"$SLICER_CI" verify-package'

      # Apple must notarize the package before macOS will open it without a
      # warning. The submission is rejected outright if anything in the bundle
      # is unsigned or lacks the hardened runtime.
      - name: Notarize and staple
        if: matrix.platform == 'macos' && steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          PACKAGE: ${{ steps.package.outputs.package }}
        run: |
          set -euo pipefail
          dmg="$SLICER_OUTPUT_DIR/$PACKAGE"
          key="$RUNNER_TEMP/apple-api-key.p8"
          echo "$APPLE_API_KEY" | base64 --decode > "$key"
          echo "Submitting $PACKAGE to Apple"
          xcrun notarytool submit "$dmg" \
            --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 45m
          rm -f "$key"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          # What Gatekeeper itself will decide.
          spctl --assess --type open --context context:primary-signature -vv "$dmg"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.platform }}
          path: ${{ env.SLICER_OUTPUT_DIR }}/${{ steps.package.outputs.package }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Write manifest
        if: needs.setup.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$SLICER_CI" manifest "$SLICER_OUTPUT_DIR/manifest-${SLICER_PLATFORM}.json" \
            "qt_version=$SLICER_QT_VERSION" \
            "commit=$GITHUB_SHA" \
            "run_id=$GITHUB_RUN_ID" \
            "package=${{ steps.package.outputs.package }}" \
            "deps_release_tag=nightly"

      - name: Archive the build tree
        if: needs.setup.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Extensions never rebuild an external project, so the published
          # tree can be reduced. The prerequisites release keeps its objects.
          "$SLICER_CI" strip --objects --vcs "$SLICER_SUPERBUILD_DIR"
          # Split in three archives so that consumers can fetch only what they need:
          #  - the source tree (SlicerConfig.cmake points into it)
          #  - the superbuild tree without the inner build (the prerequisites)
          #  - the inner build tree
          "$SLICER_CI" pack "$SLICER_OUTPUT_DIR/slicer-source-${SLICER_PLATFORM}.tar.zst" \
            --exclude "*/.git" --exclude "*/.ccache" --exclude "*/.cache" Slicer
          "$SLICER_CI" pack "$SLICER_OUTPUT_DIR/slicer-build-${SLICER_PLATFORM}.tar.zst" SR/Slicer-build
          "$SLICER_CI" pack "$SLICER_OUTPUT_DIR/deps-${SLICER_PLATFORM}.tar.zst" --exclude "SR/Slicer-build*" SR
          for a in "$SLICER_OUTPUT_DIR"/*.tar.zst; do "$SLICER_CI" split "$a"; done
          ls -lh "$SLICER_OUTPUT_DIR"

      - name: Upload the build tree
        if: needs.setup.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.platform }}
          path: |
            ${{ env.SLICER_OUTPUT_DIR }}/manifest-${{ matrix.platform }}.json
            ${{ env.SLICER_OUTPUT_DIR }}/slicer-source-${{ matrix.platform }}.tar.zst*
            ${{ env.SLICER_OUTPUT_DIR }}/slicer-build-${{ matrix.platform }}.tar.zst*
            ${{ env.SLICER_OUTPUT_DIR }}/deps-${{ matrix.platform }}.tar.zst*
          retention-days: 5
          compression-level: 0
          if-no-files-found: error

      - name: Fail on test failures or an unusable package
        if: (steps.tests.outcome == 'failure' || steps.verify.outcome == 'failure') && github.event_name != 'schedule'
        shell: bash
        run: |
          if [ "${{ steps.verify.outcome }}" = "failure" ]; then
            echo "::error::The application bundle is not self-contained."
          fi
          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            echo "::error::The test suite reported failures."
          fi
          exit 1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-${{ matrix.platform }}
          path: ${{ env.SLICER_OUTPUT_DIR }}/*.log
          retention-days: 5
          if-no-files-found: ignore

  #-----------------------------------------------------------------------------
  # Publish the build trees so that extension repositories can build against
  # the latest nightly Slicer.
  #-----------------------------------------------------------------------------
  publish:
    name: Publish nightly
    needs: [setup, deps-key, slicer]
    # Deliberately not conditioned on the Slicer job succeeding. That job fails
    # when tests fail, which must not withhold packages that were built,
    # verified and uploaded. Whether every platform actually produced its
    # artifacts is checked below, so a failed build still blocks publishing.
    if: ${{ !cancelled() && needs.setup.outputs.publish == 'true' && needs.slicer.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download build trees
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*
          path: assets
          merge-multiple: true

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      # A platform whose build or packaging failed never uploaded its
      # artifacts. Publishing a release missing one would leave extension
      # repositories building against a half-updated nightly.
      - name: Check that every platform produced its artifacts
        shell: bash
        env:
          MATRIX: ${{ needs.deps-key.outputs.matrix }}
        run: |
          set -euo pipefail
          missing=0
          for platform in $(echo "$MATRIX" | jq -r '.include[].platform'); do
            for f in "manifest-${platform}.json" "slicer-source-${platform}.tar.zst" \
                     "slicer-build-${platform}.tar.zst" "deps-${platform}.tar.zst"; do
              if ! ls "assets/$f"* >/dev/null 2>&1; then
                echo "::error::$platform did not produce $f"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Every platform produced a complete set of artifacts."

      # Provenance for the packages, verifiable with "gh attestation verify".
      # This is a statement about how the packages were built; it is unrelated
      # to code signing and does not affect whether an operating system will
      # run them. It is done here rather than on each build runner so that a
      # network failure while attesting cannot withhold a platform's artifacts.
      - name: Attest the packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/*

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp packages/* assets/
          ls -lh assets
          tag="nightly"
          notes="Nightly Slicer build trees and packages.

          Built from \`$GITHUB_SHA\` on $(date -u +%Y-%m-%d).

          Extension repositories can build against this nightly with the
          \`Slicer/Slicer/.github/actions/setup-slicer-build\` action.
          See \`Docs/developer_guide/build_instructions/github_actions.md\`."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes" --latest=false --prerelease
          else
            gh release create "$tag" --title "Slicer nightly" --notes "$notes" --prerelease --latest=false
          fi
          # Replace all the assets of the release. The package name carries the
          # date, so uploading alone would accumulate one package per day rather
          # than replacing yesterday's; remove whatever this run did not produce.
          gh release upload "$tag" assets/* --clobber
          ( cd assets && ls ) | LC_ALL=C sort -u > keep.txt
          gh release view "$tag" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort -u > have.txt
          comm -13 keep.txt have.txt > stale.txt
          while read -r asset; do
            [ -n "$asset" ] || continue
            echo "Removing the superseded asset $asset"
            gh release delete-asset "$tag" "$asset" --yes || true
          done < stale.txt

  #-----------------------------------------------------------------------------
  # Start the build of every extension repository following the nightly.
  #
  # A repository follows the nightly by installing the Slicer nightly GitHub
  # App: the app's installations are the list of repositories to notify, so
  # nothing has to be registered here. The app only holds the Actions
  # permission, which starts workflows and cannot change code, plus read access
  # to see whether the workflow exists.
  #
  # This is a separate app from the one in SLICER_APP_ID, whose permissions on
  # this repository must not be granted to every extension installing it.
  #
  # What is started is the workflow named by NIGHTLY_WORKFLOW, on the default
  # branch of the repository, which declares `on: workflow_dispatch`.
  # Repositories without it are skipped. See
  # Docs/developer_guide/build_instructions/github_actions.md
  #
  # Run alone with the notify-only input of a manual run, against whatever the
  # nightly release currently holds.
  #-----------------------------------------------------------------------------
  notify:
    name: Start the extension builds
    needs: [publish]
    if: >-
      ${{ !cancelled() && vars.SLICER_NIGHTLY_APP_ID != ''
          && (needs.publish.result == 'success' || inputs.notify-only) }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Start the builds
        shell: bash
        env:
          APP_ID: ${{ vars.SLICER_NIGHTLY_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SLICER_NIGHTLY_APP_PRIVATE_KEY }}
          NIGHTLY_WORKFLOW: slicer-nightly-build.yml
          # Between two requests that create something, to stay clear of the
          # secondary rate limit on content creation when many repositories
          # follow the nightly.
          PACE_SECONDS: "1"
        run: |
          set -uo pipefail
          if [ -z "${APP_PRIVATE_KEY:-}" ]; then
            echo "::warning::SLICER_NIGHTLY_APP_ID is set but the SLICER_NIGHTLY_APP_PRIVATE_KEY secret is not; no extension build started."
            exit 0
          fi
          api="https://api.github.com"
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

          key="$(mktemp)"
          summary="$(mktemp)"
          trap 'rm -f "$key" "$summary"' EXIT
          printf '%s\n' "$APP_PRIVATE_KEY" > "$key"

          # The app authenticates as itself with a JWT valid for ten minutes at
          # most, to list its installations and make their tokens. It is made
          # again after seven minutes, since pacing makes a long list outlast it.
          jwt="" jwt_made=0
          refresh_jwt() {
            local now header payload signature
            now="$(date +%s)"
            if [ -n "$jwt" ] && [ $((now - jwt_made)) -lt 420 ]; then
              return 0
            fi
            header="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
            payload="$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$APP_ID" | b64url)"
            signature="$(printf '%s.%s' "$header" "$payload" \
                         | openssl dgst -sha256 -sign "$key" -binary | b64url)" || return 1
            [ -n "$signature" ] || return 1
            jwt="$header.$payload.$signature"
            jwt_made="$now"
            echo "::add-mask::$jwt"
          }

          # call <token> <curl arguments...>: prints the response body. Waits
          # and retries when GitHub asks to slow down.
          call() {
            local token="$1"; shift
            local attempt body headers code wait
            body="$(mktemp)"; headers="$(mktemp)"
            for attempt in 1 2 3 4; do
              code="$(curl -sS -o "$body" -D "$headers" -w '%{http_code}' \
                        -H "Accept: application/vnd.github+json" \
                        -H "X-GitHub-Api-Version: 2022-11-28" \
                        -H "Authorization: Bearer $token" "$@")" || code=000
              case "$code" in
                2??)
                  cat "$body"; rm -f "$body" "$headers"; return 0 ;;
                403|429)
                  wait="$(tr -d '\r' < "$headers" | sed -n 's/^[Rr]etry-[Aa]fter: *\([0-9][0-9]*\).*/\1/p' | head -n 1)"
                  if [ -n "$wait" ] || grep -qi 'secondary rate limit' "$body"; then
                    wait="${wait:-60}"
                    echo "Rate limited, waiting ${wait}s" >&2
                    sleep "$wait"
                    continue
                  fi ;;
              esac
              echo "HTTP $code: $(head -c 300 "$body")" >&2
              break
            done
            rm -f "$body" "$headers"
            return 1
          }

          # A wrong key or app ID fails here, which is a configuration error.
          refresh_jwt || { echo "::error::Could not sign with SLICER_NIGHTLY_APP_PRIVATE_KEY"; exit 1; }
          installations="" page=1
          while :; do
            refresh_jwt
            batch="$(call "$jwt" "$api/app/installations?per_page=100&page=$page")" \
              || { echo "::error::Could not list the installations of app $APP_ID; are SLICER_NIGHTLY_APP_ID and SLICER_NIGHTLY_APP_PRIVATE_KEY from the same app?"; exit 1; }
            batch="$(printf '%s' "$batch" | jq -r '.[].id')"
            [ -n "$batch" ] || break
            installations="$installations $batch"
            page=$((page + 1))
          done
          echo "Installations: $(echo $installations | wc -w)"

          # From here on, one repository failing never stops the others.
          started=0 skipped=0 failed=0
          for installation in $installations; do
            sleep "$PACE_SECONDS"
            refresh_jwt
            if ! token="$(call "$jwt" -X POST "$api/app/installations/$installation/access_tokens" | jq -re .token)"; then
              echo "::warning::No token for installation $installation"
              echo "| installation $installation | **failed**: no token |" >> "$summary"
              failed=$((failed + 1))
              continue
            fi
            echo "::add-mask::$token"
            page=1
            while :; do
              if ! repos="$(call "$token" "$api/installation/repositories?per_page=100&page=$page" \
                            | jq -r '.repositories[] | "\(.full_name) \(.default_branch)"')"; then
                echo "::warning::Could not list the repositories of installation $installation"
                echo "| installation $installation | **failed**: could not list its repositories |" >> "$summary"
                failed=$((failed + 1))
                break
              fi
              [ -n "$repos" ] || break
              while read -r repo branch; do
                if ! call "$token" "$api/repos/$repo/actions/workflows/$NIGHTLY_WORKFLOW" >/dev/null 2>&1; then
                  echo "$repo: no $NIGHTLY_WORKFLOW, skipped"
                  echo "| $repo | skipped: no \`$NIGHTLY_WORKFLOW\` |" >> "$summary"
                  skipped=$((skipped + 1))
                  continue
                fi
                sleep "$PACE_SECONDS"
                if call "$token" -X POST "$api/repos/$repo/actions/workflows/$NIGHTLY_WORKFLOW/dispatches" \
                     -d "{\"ref\":\"$branch\"}" >/dev/null; then
                  echo "$repo: started $NIGHTLY_WORKFLOW on $branch"
                  echo "| $repo | started on \`$branch\` |" >> "$summary"
                  started=$((started + 1))
                else
                  echo "::warning::$repo: could not start $NIGHTLY_WORKFLOW on $branch"
                  echo "| $repo | **failed** to start on \`$branch\` |" >> "$summary"
                  failed=$((failed + 1))
                fi
              done <<< "$repos"
              page=$((page + 1))
            done
          done

          {
            echo "### Extension builds"
            echo
            echo "Started $started, skipped $skipped, failed $failed."
            if [ -s "$summary" ]; then
              echo
              echo "| Repository | Result |"
              echo "|---|---|"
              cat "$summary"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Started $started, skipped $skipped, failed $failed."
