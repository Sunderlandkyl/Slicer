name: Build

# Builds Slicer on Linux, macOS and Windows.
#
# The build is split in two phases so that it fits within the GitHub-hosted
# runner limits (6 h per job) and so that the expensive part is done only when
# it actually changes:
#
#   1. "prerequisites": builds the external projects of the Superbuild
#      (VTK, ITK, CTK, Python, DCMTK, ...) through the `Slicer-dependencies`
#      target. The result is keyed on the content of `SuperBuild/` so it is
#      reused, untouched, by every later run.
#   2. "slicer": restores the prerequisites and builds the inner `Slicer`
#      target, then packages and tests it.
#
# The Superbuild structure is preserved: phase 2 runs the very same superbuild
# tree, and the external projects are simply already up to date.

on:
  push:
    branches:
      - "main"
      - "master"
      # Branches used to develop the CI itself.
      - "ci/**"
  pull_request:
    branches:
      - "*"
  schedule:
    # Nightly, after the preview branch has been updated.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma separated: linux,macos,windows)"
        default: "linux,macos,windows"
      run-tests:
        description: "Run the test suite"
        type: boolean
        default: true
      publish:
        description: "Publish the build trees to the 'nightly' release"
        type: boolean
        default: false
      rebuild-prerequisites:
        description: "Force a rebuild of the prerequisites"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SLICER_DEPS_KEY_VERSION: "1"

jobs:
  #-----------------------------------------------------------------------------
  # Decide what to build.
  #-----------------------------------------------------------------------------
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      run-tests: ${{ steps.matrix.outputs.run-tests }}
      publish: ${{ steps.matrix.outputs.publish }}
      force-deps: ${{ steps.matrix.outputs.force-deps }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Compute matrix
        id: matrix
        shell: bash
        env:
          PLATFORMS: ${{ github.event.inputs.platforms || 'linux,macos,windows' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # On pull requests only Linux is built, to keep the feedback fast and
          # the cost low. Pushes, nightly runs and manual runs build everything.
          if [ "$EVENT" = "pull_request" ]; then
            PLATFORMS="linux"
          elif [ "$EVENT" = "push" ] && [ "${GITHUB_REF_NAME}" != "main" ] && [ "${GITHUB_REF_NAME}" != "master" ]; then
            # Development branches for the CI itself: use the workflow default.
            PLATFORMS="${SLICER_CI_PLATFORMS:-linux}"
          fi
          entries=""
          for p in ${PLATFORMS//,/ }; do
            case "$p" in
              linux)   entries="$entries {\"platform\":\"linux\",\"runner\":\"ubuntu-22.04\"}," ;;
              macos)   entries="$entries {\"platform\":\"macos\",\"runner\":\"macos-15\"}," ;;
              windows) entries="$entries {\"platform\":\"windows\",\"runner\":\"windows-2022\"}," ;;
              *) echo "::warning::unknown platform '$p'" ;;
            esac
          done
          matrix="{\"include\":[${entries%,}]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"
          run_tests="${{ github.event.inputs.run-tests || 'true' }}"
          echo "run-tests=$run_tests" >> "$GITHUB_OUTPUT"
          publish="${{ github.event.inputs.publish || 'false' }}"
          if [ "$EVENT" = "schedule" ]; then publish="true"; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "force-deps=${{ github.event.inputs.rebuild-prerequisites || 'false' }}" >> "$GITHUB_OUTPUT"

  #-----------------------------------------------------------------------------
  # Phase 1: build (or reuse) the prerequisites.
  #
  # A full build of the external projects does not fit in the 6 h limit of a
  # GitHub-hosted job, so it is split in several stages chained through
  # artifacts. Each stage builds a group of external projects in the superbuild
  # tree produced by the previous one.
  #
  # The result is stored as the assets of a release named after a key computed
  # from the files describing the external projects. Later runs restore it
  # instead of rebuilding, and rebuild only when an external project changes.
  #-----------------------------------------------------------------------------
  deps-key:
    name: Prerequisites key (${{ matrix.platform }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    outputs:
      key: ${{ steps.key.outputs.key }}
      cached: ${{ steps.key.outputs.cached }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Compute key
        id: key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ needs.setup.outputs.force-deps }}
          SLICER_PLATFORM: ${{ matrix.platform }}
          SLICER_RUNNER_IMAGE: ${{ matrix.runner }}
          SLICER_QT_VERSION: ${{ vars.SLICER_CI_QT_VERSION || '5.15.2' }}
          SLICER_SOURCE_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/slicer-ci.sh
          key="slicer-deps-${SLICER_PLATFORM}-$(.github/scripts/slicer-ci.sh deps-key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          cached=false
          if [ "$FORCE" != "true" ] && gh release view "$key" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            cached=true
          fi
          echo "cached=$cached" >> "$GITHUB_OUTPUT"
          {
            echo "### Prerequisites (${SLICER_PLATFORM})"
            echo ""
            echo "| Key | Already built |"
            echo "|---|---|"
            echo "| $key | $cached |"
          } >> "$GITHUB_STEP_SUMMARY"

  deps-1:
    name: Deps 1/5 base (${{ matrix.platform }})
    needs: [setup, deps-key]
    if: needs.deps-key.outputs.cached != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up environment
        uses: ./.github/actions/slicer-env
        with:
          free-disk-space: ${{ matrix.platform == 'linux' }}
      - name: Build base
        uses: ./.github/actions/slicer-build-stage
        with:
          # `python` pulls in zlib, bzip2, LZMA, LibFFI, sqlite and OpenSSL.
          target: "python DCMTK curl teem LibArchive RapidJSON JsonCpp tbb CTKAppLauncherLib CTKAPPLAUNCHER CTKResEdit"
          archive-name: deps-stage
          upload-artifact: deps-stage1-${{ matrix.platform }}

  deps-2:
    name: Deps 2/5 VTK (${{ matrix.platform }})
    needs: [setup, deps-key, deps-1]
    if: needs.deps-key.outputs.cached != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up environment
        uses: ./.github/actions/slicer-env
        with:
          free-disk-space: ${{ matrix.platform == 'linux' }}
      - name: Build VTK
        uses: ./.github/actions/slicer-build-stage
        with:
          target: "VTK"
          restore-artifact: deps-stage1-${{ matrix.platform }}
          restore-archive: deps-stage
          archive-name: deps-stage
          upload-artifact: deps-stage2-${{ matrix.platform }}

  deps-3:
    name: Deps 3/5 ITK (${{ matrix.platform }})
    needs: [setup, deps-key, deps-2]
    if: needs.deps-key.outputs.cached != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up environment
        uses: ./.github/actions/slicer-env
        with:
          free-disk-space: ${{ matrix.platform == 'linux' }}
      - name: Build ITK
        uses: ./.github/actions/slicer-build-stage
        with:
          target: "ITK SlicerExecutionModel"
          restore-artifact: deps-stage2-${{ matrix.platform }}
          restore-archive: deps-stage
          archive-name: deps-stage
          upload-artifact: deps-stage3-${{ matrix.platform }}

  deps-4:
    name: Deps 4/5 CTK (${{ matrix.platform }})
    needs: [setup, deps-key, deps-3]
    if: needs.deps-key.outputs.cached != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up environment
        uses: ./.github/actions/slicer-env
        with:
          free-disk-space: ${{ matrix.platform == 'linux' }}
      - name: Build CTK
        uses: ./.github/actions/slicer-build-stage
        with:
          target: "CTK qRestAPI"
          restore-artifact: deps-stage3-${{ matrix.platform }}
          restore-archive: deps-stage
          archive-name: deps-stage
          upload-artifact: deps-stage4-${{ matrix.platform }}

  deps-5:
    name: Deps 5/5 rest (${{ matrix.platform }})
    needs: [setup, deps-key, deps-4]
    if: needs.deps-key.outputs.cached != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up environment
        uses: ./.github/actions/slicer-env
        with:
          free-disk-space: ${{ matrix.platform == 'linux' }}
      - name: Build rest
        uses: ./.github/actions/slicer-build-stage
        with:
          # Everything remaining: SimpleITK, the Python requirements and
          # the sources of the remote modules.
          target: "Slicer-dependencies"
          restore-artifact: deps-stage4-${{ matrix.platform }}
          restore-archive: deps-stage
          archive-name: deps-${{ matrix.platform }}
          upload-artifact: deps-${{ matrix.platform }}

      - name: Publish the prerequisites
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ needs.deps-key.outputs.key }}
        run: |
          set -euo pipefail
          "$SLICER_CI" split "$SLICER_OUTPUT_DIR/deps-${SLICER_PLATFORM}.tar.zst"
          gh release create "$KEY" --title "$KEY" --prerelease --latest=false \
            --notes "Prebuilt Slicer prerequisites for ${SLICER_PLATFORM}, produced by the Build workflow. Safe to delete: it is regenerated on demand." \
            2>/dev/null || true
          gh release upload "$KEY" "$SLICER_OUTPUT_DIR"/deps-${SLICER_PLATFORM}.tar.zst* --clobber

  #-----------------------------------------------------------------------------
  # Phase 2: build Slicer itself, package it and run the tests.
  #-----------------------------------------------------------------------------
  slicer:
    name: Slicer (${{ matrix.platform }})
    needs: [setup, deps-key, deps-5]
    if: always() && needs.deps-key.result == 'success' && (needs.deps-5.result == 'success' || needs.deps-key.outputs.cached == 'true')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up environment
        id: env
        uses: ./.github/actions/slicer-env
        with:
          free-disk-space: ${{ matrix.platform == 'linux' }}

      - name: Cache test data
        uses: actions/cache@640a1c2554105b57832a23eea0b4672fc7a790d5 # v4.2.3
        with:
          path: ${{ env.SLICER_ROOT }}/ExternalData
          key: slicer-testdata-${{ matrix.platform }}-${{ hashFiles('**/*.md5', '**/*.sha256', '**/*.sha512') }}
          restore-keys: slicer-testdata-${{ matrix.platform }}-

      - name: Set test data store
        shell: bash
        run: echo "ExternalData_OBJECT_STORES=$SLICER_ROOT/ExternalData" >> "$GITHUB_ENV"

      - name: Download the prerequisites
        if: needs.deps-key.outputs.cached == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ needs.deps-key.outputs.key }}
        run: |
          set -euo pipefail
          mkdir -p "$SLICER_OUTPUT_DIR/restore"
          gh release download "$KEY" -R "$GITHUB_REPOSITORY" -D "$SLICER_OUTPUT_DIR/restore" --clobber \
            -p "deps-${SLICER_PLATFORM}.tar.zst*"
          "$SLICER_CI" unpack "$SLICER_OUTPUT_DIR/restore/deps-${SLICER_PLATFORM}.tar.zst"
          rm -rf "$SLICER_OUTPUT_DIR/restore"

      - name: Build Slicer
        uses: ./.github/actions/slicer-build-stage
        with:
          target: Slicer
          restore-artifact: ${{ needs.deps-key.outputs.cached == 'true' && '' || format('deps-{0}', matrix.platform) }}
          restore-archive: deps-${{ matrix.platform }}
          # Archived after packaging instead, so that the package is included.
          archive-name: ""
          strip: "false"

      - name: Package
        id: package
        shell: bash
        run: '"$SLICER_CI" package'

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.platform }}
          path: ${{ env.SLICER_OUTPUT_DIR }}/${{ steps.package.outputs.package }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Write manifest
        shell: bash
        run: |
          set -euo pipefail
          "$SLICER_CI" manifest "$SLICER_OUTPUT_DIR/manifest-${SLICER_PLATFORM}.json" \
            "qt_version=$SLICER_QT_VERSION" \
            "commit=$GITHUB_SHA" \
            "run_id=$GITHUB_RUN_ID" \
            "package=${{ steps.package.outputs.package }}" \
            "deps_release_tag=nightly"

      - name: Archive build tree
        shell: bash
        run: |
          set -euo pipefail
          "$SLICER_CI" strip "$SLICER_SUPERBUILD_DIR"
          # Split in three archives so that consumers can fetch only what they need:
          #  - the source tree (SlicerConfig.cmake points into it)
          #  - the superbuild tree without the inner build (the prerequisites)
          #  - the inner build tree
          "$SLICER_CI" pack "$SLICER_OUTPUT_DIR/slicer-source-${SLICER_PLATFORM}.tar.zst" --exclude ".git" Slicer
          "$SLICER_CI" pack "$SLICER_OUTPUT_DIR/slicer-build-${SLICER_PLATFORM}.tar.zst" SR/Slicer-build
          "$SLICER_CI" pack "$SLICER_OUTPUT_DIR/deps-${SLICER_PLATFORM}.tar.zst" --exclude "SR/Slicer-build" SR
          for a in "$SLICER_OUTPUT_DIR"/*.tar.zst; do "$SLICER_CI" split "$a"; done
          ls -lh "$SLICER_OUTPUT_DIR"

      - name: Upload build tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.platform }}
          path: |
            ${{ env.SLICER_OUTPUT_DIR }}/manifest-${{ matrix.platform }}.json
            ${{ env.SLICER_OUTPUT_DIR }}/slicer-source-${{ matrix.platform }}.tar.zst*
            ${{ env.SLICER_OUTPUT_DIR }}/slicer-build-${{ matrix.platform }}.tar.zst*
            ${{ env.SLICER_OUTPUT_DIR }}/deps-${{ matrix.platform }}.tar.zst*
          retention-days: 5
          compression-level: 0
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-${{ matrix.platform }}
          path: ${{ env.SLICER_OUTPUT_DIR }}/*.log
          retention-days: 5
          if-no-files-found: ignore

  #-----------------------------------------------------------------------------
  # Run the test suite against the build tree produced above.
  #-----------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.platform }})
    needs: [setup, slicer]
    if: needs.setup.outputs.run-tests == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up environment
        uses: ./.github/actions/slicer-env
        with:
          free-disk-space: ${{ matrix.platform == 'linux' }}
          build-source: artifact
          build-artifact-name: build-${{ matrix.platform }}
          # The build-* artifact already contains the prerequisites archive.
          deps-source: ""

      - name: Cache test data
        uses: actions/cache@640a1c2554105b57832a23eea0b4672fc7a790d5 # v4.2.3
        with:
          path: ${{ env.SLICER_ROOT }}/ExternalData
          key: slicer-testdata-${{ matrix.platform }}-${{ hashFiles('**/*.md5', '**/*.sha256', '**/*.sha512') }}
          restore-keys: slicer-testdata-${{ matrix.platform }}-

      - name: Run tests
        id: tests
        continue-on-error: true
        shell: bash
        env:
          ExternalData_OBJECT_STORES: ${{ env.SLICER_ROOT }}/ExternalData
          SLICER_CTEST_EXCLUDE: ${{ vars.SLICER_CI_TEST_EXCLUDE }}
        run: '"$SLICER_CI" test'

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.platform }}
          path: |
            ${{ env.SLICER_OUTPUT_DIR }}/test-results.xml
            ${{ env.SLICER_OUTPUT_DIR }}/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Summarize
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/test-summary.py"             "$SLICER_OUTPUT_DIR/test-results.xml" "(${{ matrix.platform }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on test failures
        if: steps.tests.outcome == 'failure' && github.event_name != 'schedule'
        shell: bash
        run: |
          echo "::error::Test suite reported failures"
          exit 1

  #-----------------------------------------------------------------------------
  # Publish the build trees so that extension repositories can build against
  # the latest nightly Slicer.
  #-----------------------------------------------------------------------------
  publish:
    name: Publish nightly
    needs: [setup, slicer, test]
    if: always() && needs.setup.outputs.publish == 'true' && needs.slicer.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download build trees
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*
          path: assets
          merge-multiple: true

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: assets
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh assets
          tag="nightly"
          notes="Nightly Slicer build trees and packages.

          Built from \`$GITHUB_SHA\` on $(date -u +%Y-%m-%d).

          Extension repositories can build against this nightly with the
          \`Slicer/Slicer/.github/actions/setup-slicer-build\` action.
          See \`Docs/developer_guide/build_instructions/github_actions.md\`."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes" --latest=false --prerelease
          else
            gh release create "$tag" --title "Slicer nightly" --notes "$notes" --prerelease --latest=false
          fi
          # Replace all the assets of the release.
          gh release upload "$tag" assets/* --clobber
